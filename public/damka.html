<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>დამკა — კომპიუტერთან</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f5230" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/board.css" />
  <script src="js/progress.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/fullscreen.js"></script>
</head>
<body>
  <div class="stage">
    <div class="top">
      <button class="back" onclick="location.href='index.html'">←</button>
      <div class="info">
        <span class="stat"><span class="dot w"></span><b id="myCount">12</b></span>
        <span class="stat"><span class="dot b"></span><b id="cpuCount">12</b></span>
        <span class="badge">პრაქტიკა</span>
      </div>
      <div class="bStat">
        <span class="dot" id="turnDot"></span>
        <span id="turnName">შენი სვლა</span>
      </div>
      <div class="msg" id="msg"></div>
      <div class="spacer" style="flex:1 1 auto"></div>
      <button class="back sndBtn" id="sndBtn" onclick="toggleSound()" title="ხმა"></button>
      <button class="newgame" onclick="startGame()">ახალი თამაში</button>
    </div>

    <div class="boardWrap">
      <div class="boardFrame" id="frame">
        <div class="dboard" id="board"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="waitOverlay">
    <div class="modal">
      <h2 id="waitTitle">ველოდებით მოწინააღმდეგეს…</h2>
      <p id="waitText"></p>
      <div class="code" id="codeBox" style="display:none"><b id="codeVal"></b></div>
      <div class="modalActions">
        <button class="alt" onclick="leaveTable()">გასვლა</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="modal">
      <h2 id="resTitle">—</h2>
      <p id="resText"></p>
      <div class="modalActions">
        <button onclick="startGame()">ახალი თამაში</button>
        <button class="alt" onclick="location.href='index.html'">გასვლა</button>
      </div>
    </div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/damka.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.io.min.js"></script>
  <script src="js/leaving.js"></script>
  <script>
  /* =====================================================================
     დამკა, against the computer.

     The engine owns the rules — which includes the awkward one, that a jump
     which can go on has to go on. This screen never has to know about it: it
     asks the engine what may be played, and if after a jump the turn has not
     changed hands, the same piece simply stays picked up.

     White is at the bottom and plays up the board, which is the way the player
     sits in front of it.
     ===================================================================== */
  /* One screen, two ways of playing. Against the computer the engine here is
     the game; online the SERVER is the game and the engine here only works out
     what may be touched. It is the same file on both sides, so the two never
     disagree about what is legal. */
  const P = new URLSearchParams(location.search);
  const MODE = ["quick", "friend", "join", "rejoin"].includes(P.get("mode")) ? P.get("mode") : "cpu";
  const ONLINE = MODE !== "cpu";
  const DEPTH = 4;
  let ME = 0, CPU = 1;
  let g = null, picked = null, busy = false;
  let socket = null, seated = false;
  const TOKEN = (function () {
    let t = localStorage.getItem("dominoToken");
    if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36);
              localStorage.setItem("dominoToken", t); }
    return t;
  })();

  function build() {
    const b = document.getElementById("board");
    b.innerHTML = "";
    /* Row 7 at the top, row 0 at the bottom, so white plays up the screen —
       and if you are black, the board is turned round, because a player looks
       at their own pieces from their own side. A half turn is square s → 63−s,
       which keeps the dark squares dark. */
    const mine = (sq) => ME === 0 ? sq : 63 - sq;
    for (let r = Damka.SIZE - 1; r >= 0; r--)
      for (let c = 0; c < Damka.SIZE; c++) {
        const slot = Damka.sq(r, c);
        const sq = mine(slot);
        const d = document.createElement("div");
        d.className = "dsq " + (Damka.dark(r, c) ? "dark" : "light");
        d.dataset.sq = sq;
        if (Damka.dark(r, c)) d.onclick = () => tap(sq);
        b.appendChild(d);
      }
  }

  function fit() {
    const wrap = document.querySelector(".boardWrap");
    const availW = wrap.clientWidth - 4, availH = wrap.clientHeight - 4;
    if (availW < 40 || availH < 40) return;
    const pad = 8;
    const sq = Math.floor(Math.min(availW - pad * 2, availH - pad * 2) / Damka.SIZE);
    document.getElementById("frame").style.setProperty("--frameP", pad + "px");
    document.getElementById("board").style.setProperty("--sqz", sq + "px");
  }

  function draw() {
    if (!g) return;
    document.querySelectorAll(".dsq").forEach((el) => {
      const s = +el.dataset.sq;
      const r = Damka.rowOf(s), c = Damka.colOf(s);
      el.className = "dsq " + (Damka.dark(r, c) ? "dark" : "light");
      el.innerHTML = "";
      const v = Damka.at(g, r, c);
      if (!v) return;
      const p = document.createElement("div");
      const side = Damka.sideOf(v);
      p.className = "pc " + (side === 0 ? "w" : "b")
        + (g.pending.some((x) => x.sq === s) ? " doomed" : "");
      if (Damka.kindOf(v) === Damka.QUEEN) p.classList.add("queen");
      el.appendChild(p);
    });

    document.getElementById("myCount").textContent = Damka.count(g, ME);
    document.getElementById("cpuCount").textContent = Damka.count(g, CPU);
    document.getElementById("turnDot").className = "dot " + (g.side === 0 ? "w" : "b");
    document.getElementById("turnName").textContent =
      g.phase === "over" ? "თამაში დასრულდა" : g.side === ME ? "შენი სვლა" : "კომპიუტერი";
    highlight();
  }

  function highlight() {
    if (!g || g.phase !== "move" || g.side !== ME || busy) return;
    /* Mid-jump the piece is already chosen and the player has no say in it,
       so it is shown picked up without being touched. */
    const from = g.mustFrom != null ? g.mustFrom : picked;
    if (from == null) {
      new Set(Damka.legalMoves(g).map((m) => m.from))
        .forEach((s) => sqEl(s).classList.add("last"));
      return;
    }
    sqEl(from).classList.add("from");
    Damka.targetsFrom(g, from).forEach((m) => sqEl(m.to).classList.add("can"));
  }
  const sqEl = (s) => document.querySelector('.dsq[data-sq="' + s + '"]');

  function tap(s) {
    if (!g || g.phase !== "move" || g.side !== ME || busy) return;
    const from = g.mustFrom != null ? g.mustFrom : picked;
    if (from != null && Damka.targetsFrom(g, from).some((m) => m.to === s)) { play(from, s); return; }
    if (g.mustFrom != null) return;                      // the jump must go on
    if (Damka.legalMoves(g).some((m) => m.from === s)) { picked = s; draw(); return; }
    picked = null; draw();
  }

  function play(from, to) {
    if (ONLINE) { socket.emit("dMove", { from, to }); picked = null; draw(); return; }
    const was = g.side;
    Damka.move(g, from, to);
    picked = null;
    if (Sound) Sound.play("place");
    draw();
    if (g.phase === "over") { finish(); return; }
    if (g.side !== was) setTimeout(cpuTurn, 380);
  }

  function cpuTurn() {
    if (!g || g.phase === "over" || g.side !== CPU) return;
    busy = true; draw();
    (function step() {
      if (g.phase === "over") { busy = false; draw(); finish(); return; }
      if (g.side !== CPU) { busy = false; draw(); return; }
      const mv = Damka.bestMove(g, DEPTH);
      if (!mv) { busy = false; draw(); return; }
      Damka.move(g, mv.from, mv.to);
      if (Sound) Sound.play("place");
      draw();
      setTimeout(step, 400);
    })();
  }

  function finish() {
    if (g.winner === null) { show("ფრე", "დიდხანს არავის არაფერი წაუღია."); return; }
    const won = g.winner === ME;
    showResult(won ? "მოიგე!" : "წააგე", g.log);
    if (Sound) Sound.play(won ? "win" : "lose");
    if (won && window.Fx) Fx.confetti();
  }

  /* The pieces are set out one after another when you sit down, the same as
     the ნარდი checkers are. There is no case to open here — a draughts board
     is a board — so it is only the laying out.

     Nothing depends on it: if the animation does not run, a background tab or a
     system asking for less movement, the pieces are simply already there. */
  const LAY_STEP = 26;

  function layOut() {
    const pcs = [...document.querySelectorAll("#board .pc")];
    pcs.forEach((p, i) => p.style.setProperty("--i", i));
    return pcs.length;
  }

  function intro() {
    return new Promise((done) => {
      const b = document.getElementById("board");
      const n = layOut();
      const still = document.hidden ||
        (matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
      if (still) { done(); return; }
      b.classList.add("dealing");
      layOut();
      for (let i = 0; i < n; i += 3)
        setTimeout(() => { if (Sound) Sound.play("lay"); }, i * LAY_STEP);
      setTimeout(() => { b.classList.remove("dealing"); done(); }, n * LAY_STEP + 280);
    });
  }

  function showResult(title, text) {
    document.getElementById("resTitle").textContent = title;
    document.getElementById("resText").textContent = text || "";
    document.getElementById("resultOverlay").classList.add("show");
  }

  /* =====================================================================
     Playing somebody.

     The server holds the board and checks every move. What arrives is the
     whole position — a board has nothing to hide — and it is written into a
     local engine of the same file, so everything that lights up here is
     something the server would accept.
     ===================================================================== */
  function applyState(st) {
    if (st.seat != null && st.seat !== ME) { ME = st.seat; CPU = 1 - ME; build(); fit(); }
    seated = true;
    if (!g) g = Damka.newGame({});
    if (st.cells) {
      g.cells = st.cells.slice();
      g.side = st.side;
      g.mustFrom = st.mustFrom;
      g.pending = (st.pending || []).map((sq) => ({ sq, was: 0 }));
      g.phase = st.dphase;
      g.winner = st.winner;
    }
    const playing = st.cells && (st.phase === "play" || st.phase === "over");
    document.getElementById("waitOverlay").classList.toggle("show", !playing);
    busy = !!st.paused;
    document.getElementById("msg").textContent =
      st.paused ? "ველოდებით — " + (st.waitingFor || []).join(", ") : (st.log || "");
    draw();
    if (st.counts) {
      document.getElementById("myCount").textContent = st.counts[ME];
      document.getElementById("cpuCount").textContent = st.counts[CPU];
    }
    document.getElementById("turnName").textContent =
      st.phase === "over" ? "თამაში დასრულდა"
      : st.paused ? "შეჩერებულია"
      : st.side === ME ? "შენი სვლა" : (st.oppName || "მოწინააღმდეგე");
  }

  function leaveTable() {
    const go = () => { if (socket) socket.emit("leaveRoom"); location.href = "index.html"; };
    if (!seated || !g) { go(); return; }
    Leaving.confirmLeave(go);
  }

  function startOnline() {
    socket = io(window.SERVER_URL || undefined, { transports: ["websocket", "polling"] });
    const who = Auth && Auth.me ? Auth.me() : null;
    const join = () => {
      const p = { game: "damka", size: 2,
                  name: (Auth && Auth.name && Auth.name()) || "მოთამაშე",
                  token: TOKEN, auth: who };
      if (MODE === "quick") socket.emit("quickJoin", p);
      else if (MODE === "friend") socket.emit("createTable", p);
      else if (MODE === "join") socket.emit("joinTable", Object.assign({ code: (P.get("code") || "").toUpperCase() }, p));
      else socket.emit("resume", { token: TOKEN, game: "damka" });
    };
    socket.on("connect", () => { if (seated) socket.emit("resume", { token: TOKEN, game: "damka" }); else join(); });
    socket.on("state", (st) => {
      if (st.code) {
        document.getElementById("codeBox").style.display = "";
        document.getElementById("codeVal").textContent = st.code;
        document.getElementById("waitText").textContent = "გაუზიარე ეს კოდი მეგობარს";
      }
      applyState(st);
    });
    socket.on("matchOver", (m) => {
      busy = true; draw();
      showResult(m.draw ? "ფრე" : m.youWon ? "მოიგე!" : "წააგე", "");
      if (m.youWon && window.Fx) Fx.confetti();
      if (Sound) Sound.play(m.youWon ? "win" : "lose");
    });
    socket.on("opponentLeft", (m) => {
      document.getElementById("msg").textContent =
        (m && m.name ? m.name : "მოწინააღმდეგე") + " გავიდა";
    });
    socket.on("joinError", (m) => {
      document.getElementById("waitTitle").textContent = "ვერ შევედი";
      document.getElementById("waitText").textContent = m || "";
    });
    socket.on("resumeFailed", () => { location.replace("index.html"); });
    socket.on("atTable", (t) => { if (t) location.replace("index.html"); });
    socket.on("disconnect", () => { document.getElementById("msg").textContent = "კავშირი გაწყდა…"; });
    build(); fit();
    document.getElementById("waitOverlay").classList.add("show");
  }
  const hide = () => document.getElementById("resultOverlay").classList.remove("show");

  async function startGame() {
    hide();
    g = Damka.newGame({});
    picked = null;
    busy = true;                     // the board is not yours until it is set
    document.getElementById("msg").textContent = "";
    build(); fit(); draw();
    await intro();
    busy = false; draw();
  }

  function toggleSound() {
    /* A class, not a glyph: the icon is drawn in CSS and there are no emoji on
       these screens. `Sound.toggle` hands back whether it is now MUTED — the
       old line read it as the opposite and drew the icon the wrong way round. */
    const isMuted = Sound.toggle();
    document.getElementById("sndBtn").classList.toggle("muted", isMuted);
  }

  document.getElementById("sndBtn").classList.toggle("muted", Sound.muted());
  document.querySelector(".stage .top .back").onclick = () =>
    ONLINE ? leaveTable() : (location.href = "index.html");
  addEventListener("resize", () => { fit(); draw(); });
  if (ONLINE) startOnline(); else startGame();
  </script>
</body>
</html>
