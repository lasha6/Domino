<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ნარდი — კაკალი</title>
<style>
:root{
  --nv:#0a1020;
  --gold:#c9a24a;
  --gold-hi:#f0dca0;
  --gold-lo:#8a6a26;
  /* ebony and boxwood: the older pairing, and the one that shows an
     ornament best — gold on black reads from across a room */
  --ebony:#17171a;
  --ebony-hi:#2c2c31;
  --ivory:#e8dcbb;
  --ivory-hi:#f6eed6;

  --cd:46px;            /* checker */
  --stack:6px;          /* daylight between one piece and the next */
  --rowH:calc(var(--cd) * 5 + var(--stack) * 4 + 16px);
  --colW:calc(var(--cd) * 1.36);
  --spineW:34px;
  --railW:44px;         /* the carved edge */
  --padV:26px;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:
    radial-gradient(120% 90% at 50% 0%, #16223c 0%, #0a1020 55%, #04070f 100%);
  display:grid; place-items:center; overflow:hidden;
  font-family:"Segoe UI",system-ui,"Noto Sans Georgian",sans-serif;
}

/* =====================================================================
   The wood itself.

   Perlin noise stretched along one axis IS grain — that is how procedural
   wood has always been made. The turbulence gives the streaks, the table in
   the transfer bends grey into walnut, and a second pass at a different
   frequency puts the broad figure over the top. No image is loaded, so this
   costs the APK nothing and works with no network at all.
   ===================================================================== */
svg.grain{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

.case{
  position:relative; overflow:hidden;
  padding:var(--padV) var(--railW);
  border-radius:6px;
  box-shadow:
    0 0 0 1px #1b1008,
    0 2px 0 rgba(255,255,255,.06) inset,
    0 30px 60px rgba(0,0,0,.75),
    0 60px 120px rgba(0,0,0,.5);
}
/* a line of brass let in just short of the edge */
.case::before{
  content:""; position:absolute; z-index:2; pointer-events:none;
  left:9px; right:9px; top:9px; bottom:9px;
  border:1px solid rgba(201,162,74,.42);
  border-radius:3px;
}
/* the lit edge of a solid piece of timber */
.case::after{
  content:""; position:absolute; inset:0; border-radius:6px; pointer-events:none;
  box-shadow:
    inset 0 2px 1px rgba(255,225,180,.16),
    inset 0 -3px 6px rgba(0,0,0,.6),
    inset 4px 0 10px rgba(0,0,0,.35),
    inset -4px 0 10px rgba(0,0,0,.35);
}

/* ---------------- the carved edge ---------------- */
.rail{
  position:absolute; top:calc(var(--padV) + 26px); bottom:calc(var(--padV) + 26px);
  width:calc(var(--railW) * .58);
  background:linear-gradient(160deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  opacity:.92; pointer-events:none; z-index:2;
  -webkit-mask:var(--band) repeat-y center / 100% 92px;
  mask:var(--band) repeat-y center / 100% 92px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.55));
}
.rail.l{ left:calc(var(--railW) * .21); }
.rail.r{ right:calc(var(--railW) * .21); }

.corner{
  position:absolute; width:46px; height:46px; z-index:3; pointer-events:none;
  background:linear-gradient(150deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo));
  -webkit-mask:var(--cnr) no-repeat center / contain;
  mask:var(--cnr) no-repeat center / contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
.corner.tl{ left:11px; top:11px; }
.corner.tr{ right:11px; top:11px; transform:scaleX(-1); }
.corner.bl{ left:11px; bottom:11px; transform:scaleY(-1); }
.corner.br{ right:11px; bottom:11px; transform:scale(-1,-1); }

/* ---------------- the playing field ---------------- */
.field{
  position:relative; display:flex; overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.75),
    0 0 0 2px rgba(201,162,74,.35),
    inset 0 10px 24px rgba(0,0,0,.55),
    inset 0 -8px 20px rgba(0,0,0,.4);
}
.half{ position:relative; overflow:hidden; display:flex; flex-direction:column; }
/* the light falls off towards the corners of a sunken box */
.field::after{
  content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
  background:radial-gradient(120% 96% at 50% 40%, rgba(0,0,0,0) 56%, rgba(0,0,0,.30) 100%);
}
.row{ display:flex; height:var(--rowH); align-items:stretch; position:relative; z-index:1; }
.pt{ position:relative; width:var(--colW); display:flex; flex-direction:column; align-items:center; }
.row.bot .pt{ flex-direction:column-reverse; }

/* A point is let into the surface: the veneer is cut away and the ivory or the
   wine is laid in, with a hair of gold round the edge of the cut. */
/* the gold hairline is the edge of the cut, and it is what keeps a black
   point from disappearing into a dark board */
.pt::after{
  content:""; position:absolute; left:0; right:0; top:1.2%; bottom:11.6%;
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  background:linear-gradient(180deg, rgba(201,162,74,.85), rgba(138,106,38,.35));
  z-index:0;
}
.row.bot .pt::after{ top:11.6%; bottom:1.2%; transform:scaleY(-1); }
.pt .tri{
  position:absolute; z-index:1; left:1px; right:1px; top:1.5%; bottom:12%;
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  background:
    repeating-linear-gradient(91deg, rgba(120,96,52,.06) 0 1px, rgba(0,0,0,0) 1px 7px),
    linear-gradient(178deg, var(--ivory-hi), var(--ivory) 52%, #cdbe95);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.22);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));
}
.pt.odd .tri{
  background:
    repeating-linear-gradient(89deg, rgba(255,255,255,.035) 0 1px, rgba(0,0,0,0) 1px 6px),
    linear-gradient(178deg, var(--ebony-hi), var(--ebony) 52%, #08080a);
}
.row.bot .pt .tri{ top:12%; bottom:1.5%; transform:scaleY(-1); }

/* cut shallow into the middle of each half, and never the same twice */
.sprig{
  position:absolute; z-index:0; left:50%; top:50%; transform:translate(-50%,-50%);
  width:150px; height:92px; opacity:.62;
  background:linear-gradient(160deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  -webkit-mask:var(--vine) no-repeat center / contain;
  mask:var(--vine) no-repeat center / contain;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.5));
}
.half.r .sprig{
  width:196px; height:97px; opacity:.58;
  -webkit-mask-image:var(--map);
  mask-image:var(--map);
}

/* ---------------- the spine ---------------- */
.spine{
  position:relative; width:var(--spineW); flex:none; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:6px 0;
  box-shadow:inset 2px 0 5px rgba(0,0,0,.65), inset -2px 0 5px rgba(0,0,0,.65);
}
.spine .band{
  position:absolute; left:50%; top:9%; bottom:9%; width:72%; transform:translateX(-50%);
  background:linear-gradient(160deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  opacity:.85;
  -webkit-mask:var(--band) repeat-y center / 100% 76px;
  mask:var(--band) repeat-y center / 100% 76px;
}
.spine .hinge{
  position:relative; z-index:2; width:64%; height:20px; border-radius:2px;
  background:linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 2px 4px rgba(0,0,0,.7);
}
.spine .knot{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:76%; height:56px; z-index:2;
  background:linear-gradient(160deg, var(--gold-hi), var(--gold-lo));
  -webkit-mask:var(--knot) no-repeat center / contain;
  mask:var(--knot) no-repeat center / contain;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));
}

/* ---------------- the checkers ----------------
   A turned disc with a real edge: the stack of hard shadows under it is the
   side of the piece, the inset pair is the bevel where the face rolls over,
   and the gold ring is the band let into the rim. */
.chk{
  position:relative; flex:none; z-index:3;
  width:var(--cd); height:var(--cd); border-radius:50%;
  margin-top:var(--gap, 0px);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.5),
    0 1px 0 rgba(0,0,0,.42), 0 2px 0 rgba(0,0,0,.36),
    0 3px 0 rgba(0,0,0,.30), 0 4px 0 rgba(0,0,0,.22),
    0 7px 10px rgba(0,0,0,.6), 0 12px 20px rgba(0,0,0,.4),
    inset 0 2px 3px rgba(255,255,255,.45),
    inset 0 -4px 6px rgba(0,0,0,.38);
}
.row.bot .chk{ margin-top:0; margin-bottom:var(--gap, 0px); }
.chk.w{ background:radial-gradient(circle at 36% 28%, #fbf4e0, var(--ivory) 52%, #c3b489); }
.chk.b{ background:radial-gradient(circle at 36% 28%, #3a3a41, var(--ebony) 48%, #050507); }
/* the band round the rim, and the groove just inside it */
.chk::before{
  content:""; position:absolute; inset:7%; border-radius:50%;
  box-shadow:
    0 0 0 2px rgba(201,162,74,.85),
    inset 0 1px 1px rgba(0,0,0,.30),
    0 1px 0 rgba(255,255,255,.28);
}
/* the vine struck into the face */
.chk::after{
  content:""; position:absolute; inset:24%;
  background:linear-gradient(160deg, var(--gold-hi), var(--gold) 50%, var(--gold-lo));
  -webkit-mask:var(--bunch) no-repeat center / contain;
  mask:var(--bunch) no-repeat center / contain;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.45));
  opacity:.95;
}

/* ---------------- the dice ---------------- */
.dice{ position:absolute; z-index:6; left:70%; top:60%; display:flex; gap:20px; }
/* The dice are made of whatever the pieces are made of: the shop writes
   --bone-* and --pip on the root, and they are the only colours in here. With
   nothing bought they fall back to plain bone. */
.die{
  width:52px; height:52px; border-radius:9px; position:relative;
  background:
    radial-gradient(120% 120% at 30% 22%,
      var(--bone-hi, #fffdf6), var(--bone, #f4eeda) 48%, var(--bone-lo, #cdc2a2));
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.55),
    inset 0 -5px 8px rgba(0,0,0,.30),
    0 0 0 1px rgba(0,0,0,.45),
    0 10px 16px rgba(0,0,0,.6),
    0 20px 32px rgba(0,0,0,.35);
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:8px;
}
.die.one{ transform:rotate(-13deg); }
.die.two{ transform:rotate(9deg); }
.die span{ display:grid; place-items:center; }
.die i{
  width:9px; height:9px; border-radius:50%;
  background:var(--pip, #15150f);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.28);
}
</style>
</head>
<body>

<!-- the ornament, drawn once and used as a mask everywhere: the ink is a CSS
     colour, so the same drawing is gold on the rail and gold on a checker -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- walnut: streaks along the grain, then broad figure over the top -->
    <filter id="walnut" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.42" numOctaves="6" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="wood">
        <feFuncR type="table" tableValues="0.09 0.17 0.25 0.18 0.29 0.20 0.14"/>
        <feFuncG type="table" tableValues="0.05 0.09 0.14 0.10 0.16 0.11 0.07"/>
        <feFuncB type="table" tableValues="0.02 0.05 0.08 0.05 0.09 0.06 0.04"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.035" numOctaves="4" seed="19" result="f"/>
      <feColorMatrix in="f" type="saturate" values="0" result="fg"/>
      <feComponentTransfer in="fg" result="fig">
        <feFuncA type="table" tableValues="0 0.30 0"/>
      </feComponentTransfer>
      <feComposite in="fig" in2="wood" operator="atop" result="lit"/>
      <feBlend in="lit" in2="wood" mode="multiply" result="flat"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="5" result="warp"/>
      <feDisplacementMap in="flat" in2="warp" scale="26"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- the field is the same timber cut the other way and left a shade lighter -->
    <filter id="walnutField" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.38" numOctaves="6" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="flat">
        <feFuncR type="table" tableValues="0.19 0.30 0.40 0.31 0.44 0.33 0.25"/>
        <feFuncG type="table" tableValues="0.11 0.18 0.24 0.18 0.27 0.20 0.15"/>
        <feFuncB type="table" tableValues="0.05 0.08 0.12 0.09 0.14 0.10 0.07"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="11" result="warp"/>
      <feDisplacementMap in="flat" in2="warp" scale="30"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="walnutSpine" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.44" numOctaves="5" seed="41" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g">
        <feFuncR type="table" tableValues="0.08 0.15 0.22 0.16 0.26"/>
        <feFuncG type="table" tableValues="0.04 0.08 0.13 0.09 0.15"/>
        <feFuncB type="table" tableValues="0.02 0.04 0.07 0.05 0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div class="case" id="case">
  <svg class="grain"><rect width="100%" height="100%" filter="url(#walnut)"/></svg>
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
  <span class="rail l"></span><span class="rail r"></span>

  <div class="field" id="field"></div>

  <div class="dice">
    <div class="die one" data-n="3"></div>
    <div class="die two" data-n="4"></div>
  </div>
</div>

<script>
/* ---------------- the drawings ----------------
   Thin strokes, because this is carving and inlay, not a stencil. Each one is
   an SVG in a data URI used as a CSS mask, so the metal is a CSS colour and
   nothing is ever fetched. */
const svg = (vb, body) =>
  "url(\"data:image/svg+xml;utf8," +
  encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '">' + body + '</svg>') +
  "\")";

const S = 'fill="none" stroke="#000" stroke-linecap="round"';

/* an arabesque band: a stem with scrolls turning off it and a lozenge between */
const band = svg("0 0 34 92",
  '<g ' + S + ' stroke-width="1.6">' +
  '<path d="M17 2v88"/>' +
  '<path d="M17 18c-7-2-11-8-9-15 6 1 10 7 9 15z"/><path d="M17 18c7-2 11-8 9-15-6 1-10 7-9 15z"/>' +
  '<path d="M17 40c-8 4-12 12-8 20 6-4 9-12 8-20z"/><path d="M17 40c8 4 12 12 8 20-6-4-9-12-8-20z"/>' +
  '<path d="M17 74c-5-1-8-5-7-10 5 1 8 5 7 10z"/><path d="M17 74c5-1 8-5 7-10-5 1-8 5-7 10z"/>' +
  '</g>' +
  '<g fill="#000"><path d="M17 26l3 4.5-3 4.5-3-4.5z"/><path d="M17 82l2.6 3.6-2.6 3.6-2.6-3.6z"/>' +
  '<circle cx="17" cy="50" r="2.2"/></g>');

/* the corner: two thin scrolls turning into the angle, with a bud at each end */
const corner = svg("0 0 60 60",
  '<g ' + S + ' stroke-width="2">' +
  '<path d="M4 56C4 27 27 4 56 4"/>' +
  '<path d="M4 40C4 20 20 4 40 4"/>' +
  '<path d="M13 56c6-17 19-30 36-36"/>' +
  '<path d="M23 21c-6-5-13-4-16 2 6 5 13 4 16-2z"/>' +
  '<path d="M39 37c5-6 4-13-2-16-5 6-4 13 2 16z"/>' +
  '</g>' +
  '<g fill="#000"><circle cx="42" cy="18" r="2.8"/><circle cx="18" cy="42" r="2.8"/></g>');

/* The near half carries the vine, the far half the country. Two different
   marks, because a board that says the same thing twice is a pattern and not a
   piece of work.

   A grape leaf is five pointed lobes with a notch between each, and veins
   running from the stem to every tip. Drawn round, it stops being a leaf. */
const leaf =
  '<path ' + S + ' stroke-width="2.6" stroke-linejoin="round" d="' +
  'M50 97V78' +
  'C43 85 29 86 19 79 C9 72 8 62 15 57 C4 55 0 44 7 36 C14 27 26 26 32 33' +
  'C25 20 31 8 41 5 C47 3 50 9 50 16' +
  'C50 9 53 3 59 5 C69 8 75 20 68 33 C74 26 86 27 93 36 C100 44 96 55 85 57' +
  'C92 62 91 72 81 79 C71 86 57 85 50 78Z"/>' +
  '<g ' + S + ' stroke-width="1.5" opacity="0.9">' +
  '<path d="M50 78V30M50 62L22 48M50 62l28-14M50 48L28 26M50 48l22-22"/>' +
  '</g>';

/* a bunch: rows of berries narrowing to a point, with a stem and a tendril */
const grapes =
  '<g fill="#000">' +
  '<circle cx="24" cy="30" r="7"/><circle cx="40" cy="30" r="7"/><circle cx="56" cy="30" r="7"/>' +
  '<circle cx="32" cy="43" r="7"/><circle cx="48" cy="43" r="7"/>' +
  '<circle cx="24" cy="56" r="7"/><circle cx="40" cy="56" r="7"/><circle cx="56" cy="56" r="7"/>' +
  '<circle cx="32" cy="69" r="7"/><circle cx="48" cy="69" r="7"/>' +
  '<circle cx="40" cy="82" r="7"/>' +
  '</g>' +
  '<g ' + S + ' stroke-width="2.4"><path d="M40 22V6"/>' +
  '<path d="M40 10c9-6 20-4 24 4-9 6-20 4-24-4z"/></g>';

const vine = svg("0 0 190 100",
  '<g transform="translate(2 0)">' + leaf + '</g>' +
  '<g transform="translate(112 4) scale(0.86)">' + grapes + '</g>' +
  '<g ' + S + ' stroke-width="2"><path d="M96 40c8-6 18-6 26 0"/></g>');

/* A stylised outline, not a survey. It has to read as the country at the size
   of a thumbnail, cut shallow into a board: the wide waist, the coast falling
   away on the west, and the point running out to the east. */
const GE =
  /* Georgia's border, simplified from coordinates rather than sketched: the
     coast running down the west, the southern frontier stepping east, the
     point at Lagodekhi, and the Caucasus back along the north. */
  'M0 8 L7.4 12 L23.7 22 L38.5 40 L49.5 58 L47.4 72 L45.9 83.2 L62.2 86 L77 96 L91.9 100 L102.2 94 L118.5 96 L133.3 90 L148.1 96 L165.9 92 L189.6 100 L199.1 96 L189.6 80 L177.8 64 L165.9 48 L148.1 40 L133.3 36 L118.5 40 L103.7 34 L88.9 24 L74.1 16 L59.3 12 L29.6 8Z';
const map = svg("0 0 200 102",
  '<path d="' + GE + '" fill="#000" fill-opacity="0.14"/>' +
  '<path d="' + GE + '" ' + S + ' stroke-width="3.4" stroke-linejoin="round"/>' +
  /* a mark where the capital stands */
  '<g fill="#000"><circle cx="130" cy="55" r="5"/></g>');

/* a small bunch for the face of a checker */
const bunch = svg("0 0 44 44",
  '<g fill="#000">' +
  '<circle cx="22" cy="20" r="4.2"/><circle cx="14" cy="26" r="4.2"/><circle cx="30" cy="26" r="4.2"/>' +
  '<circle cx="18" cy="33" r="4.2"/><circle cx="26" cy="33" r="4.2"/><circle cx="22" cy="40" r="4.2"/>' +
  '</g>' +
  '<g ' + S + ' stroke-width="2"><path d="M22 15V6"/><path d="M22 9c5-4 11-4 15 0-4 4-11 4-15 0z"/></g>');

/* a knot for the middle of the spine */
const knot = svg("0 0 40 60",
  '<g ' + S + ' stroke-width="2">' +
  '<path d="M20 4v52"/><path d="M6 30h28"/>' +
  '<path d="M20 14c-7 3-10 10-7 16 6-3 8-10 7-16z"/><path d="M20 14c7 3 10 10 7 16-6-3-8-10-7-16z"/>' +
  '</g><g fill="#000"><circle cx="20" cy="30" r="3.4"/></g>');

const root = document.documentElement.style;
root.setProperty("--band", band);
root.setProperty("--cnr", corner);
root.setProperty("--vine", vine);
root.setProperty("--map", map);
root.setProperty("--bunch", bunch);
root.setProperty("--knot", knot);

/* ---------------- the board ---------------- */
const START = { 0:[2,'w'], 5:[5,'b'], 7:[3,'b'], 11:[5,'w'],
                12:[5,'b'], 16:[3,'w'], 18:[5,'w'], 23:[2,'b'] };
const CD = 46, GAP = 6;

function point(i){
  const d = document.createElement('div');
  d.className = 'pt' + (i % 2 ? ' odd' : '');
  d.innerHTML = '<span class="tri"></span>';
  const s = START[i];
  if (s) {
    const [n, side] = s;
    const gap = n <= 5 ? GAP : -(CD * (n - 5) + GAP * (n - 1)) / (n - 1) + GAP;
    for (let k = 0; k < n; k++) {
      const c = document.createElement('div');
      c.className = 'chk ' + side;
      c.style.setProperty('--gap', (k === 0 ? 0 : gap) + 'px');
      d.appendChild(c);
    }
  }
  return d;
}
function row(cls, from, to){
  const r = document.createElement('div');
  r.className = 'row ' + cls;
  const step = from <= to ? 1 : -1;
  for (let i = from; step > 0 ? i <= to : i >= to; i += step) r.appendChild(point(i));
  return r;
}
function half(side, a, b){
  const h = document.createElement('div');
  h.className = 'half ' + side;
  h.innerHTML = '<svg class="grain"><rect width="100%" height="100%" filter="url(#walnutField)"/></svg>' +
                '<span class="sprig"></span>';
  h.appendChild(a); h.appendChild(b);
  return h;
}
const f = document.getElementById('field');
f.appendChild(half('l', row('top', 12, 17), row('bot', 11, 6)));

const spine = document.createElement('div');
spine.className = 'spine';
spine.innerHTML = '<svg class="grain"><rect width="100%" height="100%" filter="url(#walnutSpine)"/></svg>' +
                  '<span class="band"></span><span class="hinge"></span>' +
                  '<span class="knot"></span><span class="hinge"></span>';
f.appendChild(spine);
f.appendChild(half('r', row('top', 18, 23), row('bot', 5, 0)));

/* pips, in the cells they actually occupy */
const CELLS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
document.querySelectorAll('.die').forEach((d) => {
  const on = CELLS[+d.dataset.n];
  for (let c = 0; c < 9; c++) {
    const s = document.createElement('span');
    if (on.includes(c)) s.appendChild(document.createElement('i'));
    d.appendChild(s);
  }
});
</script>
</body>
