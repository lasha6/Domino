<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ნარდი — კომპიუტერთან</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f5230" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/board.css" />
  <script src="js/progress.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewport.js"></script>

</head>
<body>
  <div class="stage">
    <div class="top">
      <button class="back" onclick="location.href='index.html'">←</button>
      <div class="info">
        <span class="stat"><span class="k">ანგარიში</span><b id="scoreLbl">0 : 0</b></span>
        <span class="stat"><span class="dot w"></span><b id="myPip">—</b></span>
        <span class="stat"><span class="dot b"></span><b id="cpuPip">—</b></span>
        <span class="badge">🎓 პრაქტიკა</span>
      </div>
      <div class="bStat">
        <span class="dot" id="turnDot"></span>
        <span id="turnName">შენი სვლა</span>
        <button class="rollBtn" id="rollBtn" onclick="doRoll()">გააგორე</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="spacer" style="flex:1 1 auto"></div>
      <button class="back sndBtn" id="sndBtn" onclick="toggleSound()" title="ხმა">🔊</button>
      <button class="newgame" onclick="startMatch()">ახალი თამაში</button>
    </div>

    <div class="boardWrap">
      <div class="boardFrame" id="frame">
        <div class="nboard" id="board"></div>
        <div class="diceLayer" id="diceLayer"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="modal">
      <h2 id="resTitle">—</h2>
      <p id="resText"></p>
      <div class="modalActions">
        <button onclick="startMatch()">ახალი თამაში</button>
        <button class="alt" onclick="location.href='index.html'">გასვლა</button>
      </div>
    </div>
  </div>

  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/nardi.js"></script>
  <script>
  /* =====================================================================
     ნარდი, against the computer.

     The engine holds the whole of the rules; this file only draws what it says
     and hands back the two things a player does — roll, and move a checker
     from one point to another.

     The board is laid out the way every ნარდი board is: the bottom row runs
     0..11 from the right, the top row 12..23 from the left, so a player's
     journey is one lap anticlockwise. Which lap it is depends on the game, and
     that lives in the engine, not here.
     ===================================================================== */
  const P = new URLSearchParams(location.search);
  const VARIANT = P.get("v") === "short" ? "short" : "long";
  const TARGET = [1, 3, 5, 7].includes(+P.get("target")) ? +P.get("target") : 3;
  const ME = 0, CPU = 1;

  let g = null;
  let picked = null;        // the track index a checker was lifted from
  let busy = false;         // the computer is thinking; the board is not yours

  document.title = (VARIANT === "short" ? "მოკლე ნარდი" : "გრძელი ნარდი") + " — კომპიუტერთან";

  /* =====================================================================
     Throwing the dice.

     Two bone cubes, thrown from off the edge of the board into the near half,
     tumbling as they go and bouncing once when they land. The engine has
     already decided what they say — the throw only has to end with those faces
     pointing at the player, which is a rotation plus a few whole turns on the
     way there.

     A face is shown by turning the cube so that face is at the front. The six
     rotations are the inverses of where the faces were built.
     ===================================================================== */
  const FACE_TURN = {
    1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0],
  };
  // which of the nine cells a face's pips occupy
  const PIPS = {
    1: ["d"], 2: ["a", "g"], 3: ["a", "d", "g"],
    4: ["a", "b", "f_", "g"], 5: ["a", "b", "d", "f_", "g"],
    6: ["a", "b", "c", "e", "f_", "g"],
  };

  function makeDie() {
    const d = document.createElement("div");
    d.className = "d3";
    for (let f = 1; f <= 6; f++) {
      const face = document.createElement("div");
      face.className = "f f" + f;
      face.innerHTML = PIPS[f].map((p) => '<i class="' + p + '"></i>').join("");
      d.appendChild(face);
    }
    return d;
  }

  /* Where the dice come to rest. Each player throws into their own half of the
     board and from their own side of the table, the way two people sitting
     opposite each other do — so you can tell whose throw it was without being
     told. */
  function restingPlace(i, n, mine) {
    const layer = document.getElementById("diceLayer");
    const W = layer.clientWidth, H = layer.clientHeight;
    const ds = dieSize();
    const spread = ds * 1.25;
    const cx = W * (mine ? 0.72 : 0.28) - (n - 1) * spread / 2 + i * spread;
    const cy = H * 0.52;
    return [cx - ds / 2 + (Math.random() - 0.5) * ds * 0.18,
            cy - ds / 2 + (Math.random() - 0.5) * ds * 0.5];
  }
  function dieSize() {
    const b = document.getElementById("board");
    return Math.max(22, parseFloat(getComputedStyle(b).getPropertyValue("--cd")) * 1.05);
  }

  /* The board is measured from the space it is given, and that space changes:
     the phone turns, the address bar slides away, the window is dragged. The
     checkers are redrawn from the game each time — the dice are not, so they
     are told where to lie again, as a fraction of the board rather than in
     pixels of the board it used to be. */
  function placeDice() {
    const layer = document.getElementById("diceLayer");
    if (!layer) return;
    const ds = dieSize();
    layer.style.setProperty("--ds", ds + "px");
    const W = layer.clientWidth, H = layer.clientHeight;
    diceEls.forEach((d) => {
      if (!d.rest) return;
      d.style.transform = `translate3d(${d.rest.fx * W}px, ${d.rest.fy * H}px, 0)` +
        ` rotateX(${d.rest.rx}deg) rotateY(${d.rest.ry}deg) scale(1)`;
    });
  }

  let diceEls = [];
  function clearDice(fade) {
    const layer = document.getElementById("diceLayer");
    if (!layer) return;
    if (!fade) { layer.innerHTML = ""; diceEls = []; return; }
    diceEls.forEach((d) => d.classList.add("gone"));
    const old = diceEls; diceEls = [];
    setTimeout(() => old.forEach((d) => d.remove()), 300);
  }

  /* Throw `values` onto the board. Resolves when they have settled, so the
     turn can wait for them rather than racing them. */
  function throwDice(values, mine) {
    return new Promise((done) => {
      const layer = document.getElementById("diceLayer");
      clearDice(false);
      const ds = dieSize();
      layer.style.setProperty("--ds", ds + "px");
      const W = layer.clientWidth, H = layer.clientHeight;
      const DUR = 820;

      /* A throw needs the animation to actually run. It does not when the tab
         is in the background — a locked phone, another app — and it should not
         when the player has asked their system for less movement. In both cases
         the dice are simply put down where they belong: the alternative is an
         animation frozen at frame one, holding two dice off the edge of the
         board until the player comes back. */
      const still = document.hidden ||
        (matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
      const running = [];

      if (Sound) Sound.play(still ? "diceLand" : "diceShake", DUR / 1000);
      values.forEach((v, i) => {
        const d = makeDie();
        layer.appendChild(d);
        diceEls.push(d);
        const [x1, y1] = restingPlace(i, values.length, mine);
        // in from beyond the edge on the thrower's side, low and fast
        const x0 = mine ? W + ds * (1.2 + i * 0.5) : -ds * (1.2 + i * 0.5);
        const y0 = H * (0.18 + Math.random() * 0.2);
        const xm = x1 + (x0 - x1) * 0.42, ym = y1 - H * 0.16 - i * 6;
        const [fx, fy] = FACE_TURN[v];
        const turns = 2 + Math.floor(Math.random() * 2);
        const rx = fx + 360 * turns, ry = fy - 360 * (turns + 1);
        const at = (x, y, sx, sy, s) =>
          `translate3d(${x}px, ${y}px, 0) rotateX(${sx}deg) rotateY(${sy}deg) scale(${s})`;

        /* Where it ends up is written on the die itself, and the throw is
           played over the top of that. A browser that never runs the animation
           — a tab in the background while the phone is locked — then still has
           the dice lying in the right place when the player looks again,
           instead of stuck off the edge where they were thrown from. */
        d.rest = { fx: x1 / W, fy: y1 / H, rx, ry };
        d.style.transform = at(x1, y1, rx, ry, 1);

        if (still) return;
        running.push(d.animate([
          { transform: at(x0, y0, 0, 0, 0.7), offset: 0 },
          { transform: at(xm, ym, rx * 0.55, ry * 0.55, 1.12), offset: 0.42 },
          { transform: at(x1, y1 + ds * 0.05, rx * 0.9, ry * 0.9, 1), offset: 0.72 },
          // the bounce: up a little, then down for good
          { transform: at(x1 + ds * 0.06, y1 - ds * 0.3, rx * 0.97, ry * 0.97, 1), offset: 0.85 },
          { transform: at(x1, y1, rx, ry, 1), offset: 1 },
        ], { duration: DUR + i * 90, easing: "cubic-bezier(.22,.62,.3,1)" }));
      });

      const double = values.length === 2 && values[0] === values[1];
      if (still) {
        if (double && Sound) Sound.play("diceDouble");
        setTimeout(done, 60);
        return;
      }
      // the clatter lands with the first die, not with the animation's end
      setTimeout(() => { if (Sound) Sound.play("diceLand"); }, DUR * 0.72);
      setTimeout(() => {
        /* And when the throw is over, the animation is taken away — whether it
           ran or not. A browser that never advanced it would otherwise hold the
           dice at frame one, off the edge of the board, for good. With it gone
           they fall back to the transform written on them, which is where they
           were always going to land. Timers advance where animations sometimes
           do not, so this is the belt to that pair of braces. */
        running.forEach((a) => { try { a.cancel(); } catch (e) { /* already gone */ } });
        if (double && Sound) Sound.play("diceDouble");
        done();
      }, DUR + (values.length - 1) * 90 + 160);   // a margin, so a busy main
      // thread never has its animation cut off mid-bounce
    });
  }

  /* Dim the ones already played, so the board says what is left without being
     asked. On a double there are four moves in two dice, so both stay lit until
     fewer moves remain than there are dice lying there. */
  function markSpent() {
    if (!g || !g.dice) return;
    const left = g.left.slice();
    diceEls.forEach((d, i) => {
      const v = shownValues[i];
      const k = left.indexOf(v);
      if (k >= 0) { left.splice(k, 1); d.classList.remove("spent"); }
      else d.classList.add("spent");
    });
  }
  let shownValues = [];

  /* ---------------- drawing ---------------- */
  function build() {
    const b = document.getElementById("board");
    b.innerHTML = "";
    const top = document.createElement("div"); top.className = "nrow ntop";
    const bot = document.createElement("div"); bot.className = "nrow nbot";
    // the middle strip is one element spanning both rows, so the board is
    // built as three columns rather than two rows; simpler to keep two rows
    // and give each of them its own half of the strip
    const mkPoint = (pt) => {
      const d = document.createElement("div");
      d.className = "npt" + (pt % 2 ? " odd" : "");
      d.dataset.pt = pt;
      d.innerHTML = '<span class="tri"></span>';
      d.onclick = () => tapPoint(pt);
      return d;
    };
    const mkMid = (which) => {
      const m = document.createElement("div");
      m.className = "nmid"; m.id = "mid" + which;
      m.onclick = () => tapBar();
      return m;
    };
    for (let pt = 12; pt <= 23; pt++) {
      if (pt === 18) top.appendChild(mkMid("T"));
      top.appendChild(mkPoint(pt));
    }
    for (let pt = 11; pt >= 0; pt--) {
      if (pt === 5) bot.appendChild(mkMid("B"));
      bot.appendChild(mkPoint(pt));
    }
    const tray = document.createElement("div"); tray.className = "ntray"; tray.id = "tray";
    tray.innerHTML = '<div class="half" id="offTop"></div><div class="half bottom" id="offBot"></div>';
    tray.onclick = () => tapOff();

    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    const cols = document.createElement("div");
    cols.style.flex = "1 1 auto"; cols.style.minWidth = "0";
    cols.appendChild(top); cols.appendChild(bot);
    wrap.appendChild(cols); wrap.appendChild(tray);
    b.appendChild(wrap);
  }

  /* How big everything is. Measured from the space the board is actually
     given, never assumed: fifteen checkers have to fit on one point in
     გრძელი ნარდი, so a point is five checkers tall and the rest overlap. */
  function fit() {
    const wrap = document.querySelector(".boardWrap");
    const frame = document.getElementById("frame");
    const availW = wrap.clientWidth - 4;
    const availH = wrap.clientHeight - 4;
    if (availW < 40 || availH < 40) return;

    const pad = 8, trayF = 0.06, barF = 0.055;
    // a board is about 1.35 times as wide as it is tall, and must fit both ways
    /* 1.37 is where the two limits meet: twelve points wide at a checker
       apiece, and five checkers to a row with the rest overlapping. Any wider
       and the checkers stop filling their points; any taller and they shrink. */
    const boardH = Math.min(availH - pad * 2, (availW - pad * 2) / 1.37);
    const boardW = boardH * 1.37;
    const inner = boardW * (1 - trayF - barF);
    const cd = Math.min(inner / 12 * 0.92, boardH / 2 / 5.4);
    const rowH = boardH / 2;

    frame.style.setProperty("--frameP", pad + "px");
    const b = document.getElementById("board");
    b.style.width = boardW + "px";
    b.style.setProperty("--rowH", rowH + "px");
    b.style.setProperty("--cd", cd + "px");
    b.style.setProperty("--barW", (boardW * barF) + "px");
    b.style.setProperty("--trayW", (boardW * trayF) + "px");
    placeDice();                 // the dice lie on the board, so they move with it
  }

  function draw() {
    if (!g) return;
    const seen = g.pts;
    document.querySelectorAll(".npt").forEach((el) => {
      const pt = +el.dataset.pt;
      el.className = "npt" + (pt % 2 ? " odd" : "");
      el.querySelectorAll(".chk").forEach((c) => c.remove());
      const n = Math.abs(seen[pt]);
      if (!n) return;
      const side = seen[pt] > 0 ? 0 : 1;
      const cd = parseFloat(getComputedStyle(document.getElementById("board")).getPropertyValue("--cd"));
      // five sit clear; anything above that overlaps so the stack stays put
      const gap = n <= 5 ? 1 : -(cd * (n - 5) + (n - 1)) / (n - 1) + 1;
      for (let i = 0; i < n; i++) {
        const c = document.createElement("div");
        c.className = "chk " + (side === 0 ? "w" : "b");
        c.style.setProperty("--chkGap", (i === 0 ? 0 : gap) + "px");
        if (n > 5 && i === n - 1) c.innerHTML = '<span class="more">' + n + "</span>";
        el.appendChild(c);
      }
    });

    // the bar
    ["T", "B"].forEach((k) => {
      const m = document.getElementById("mid" + k);
      m.innerHTML = ""; m.className = "nmid";
    });
    for (const side of [0, 1]) {
      const m = document.getElementById(side === ME ? "midB" : "midT");
      for (let i = 0; i < g.bar[side]; i++) {
        const c = document.createElement("div");
        c.className = "barChk chk " + (side === 0 ? "w" : "b");
        m.appendChild(c);
      }
    }
    // the tray
    const trays = { 0: document.getElementById("offBot"), 1: document.getElementById("offTop") };
    for (const side of [0, 1]) {
      trays[side].innerHTML = "";
      for (let i = 0; i < g.off[side]; i++) {
        const d = document.createElement("div");
        d.className = "off " + (side === 0 ? "w" : "b");
        trays[side].appendChild(d);
      }
    }

    markSpent();       // the dice are on the board; they only need dimming

    // the target rides along with the score rather than taking a plate of its
    // own: the bar already carries a turn, a pair of dice and a roll button
    document.getElementById("scoreLbl").textContent =
      g.scores[ME] + " : " + g.scores[CPU] + "  → " + g.target;
    document.getElementById("myPip").textContent = Nardi.pipCount(g, ME);
    document.getElementById("cpuPip").textContent = Nardi.pipCount(g, CPU);
    document.getElementById("turnDot").className = "dot " + (g.side === 0 ? "w" : "b");
    document.getElementById("turnName").textContent =
      g.phase === "over" ? "მატჩი დასრულდა"
      : g.side === ME ? (g.phase === "roll" ? "შენი გაგორებაა" : "შენი სვლა")
      : "კომპიუტერი";
    const rb = document.getElementById("rollBtn");
    rb.style.display = (g.side === ME && g.phase === "roll") ? "" : "none";
    rb.disabled = busy;
    highlight();
  }

  /* what the player may touch right now */
  function highlight() {
    document.querySelectorAll(".npt.can, .npt.from").forEach((e) => e.classList.remove("can", "from"));
    document.getElementById("tray").classList.remove("can");
    ["midT", "midB"].forEach((k) => document.getElementById(k).classList.remove("can", "from"));
    if (!g || g.phase !== "move" || g.side !== ME || busy) return;

    if (picked === null) {
      const froms = new Set(Nardi.legalMoves(g).map((m) => m.from));
      froms.forEach((f) => {
        if (f === Nardi.BAR) document.getElementById("midB").classList.add("can");
        else ptEl(Nardi.pointAt(g, ME, f)).classList.add("can");
      });
      return;
    }
    if (picked === Nardi.BAR) document.getElementById("midB").classList.add("from");
    else ptEl(Nardi.pointAt(g, ME, picked)).classList.add("from");
    for (const t of Nardi.targetsFrom(g, picked)) {
      if (t.to === "off") document.getElementById("tray").classList.add("can");
      else ptEl(Nardi.pointAt(g, ME, t.to)).classList.add("can");
    }
  }
  const ptEl = (pt) => document.querySelector('.npt[data-pt="' + pt + '"]');

  /* ---------------- what the player does ---------------- */
  /* A throw is not instant, so the turn waits for it. `busy` holds the board
     shut while the dice are in the air — otherwise a fast tap could move a
     checker with a die that has not landed yet. */
  async function doRoll() {
    if (!g || g.phase !== "roll" || g.side !== ME || busy) return;
    busy = true;
    const rolled = Nardi.roll(g);
    /* Two dice are thrown, and two land, even on a double — a double is worth
       four moves, not four dice. The player was clear: if there are two in your
       hand, four on the table make no sense. */
    shownValues = rolled;
    draw();
    await throwDice(shownValues, true);
    busy = false;
    say(g.log || "");
    draw();
    if (g.side !== ME) setTimeout(cpuTurn, 700);
  }

  /* Tapping the felt throws them, the same as the button does. On a board you
     roll onto the board, and reaching for a button in the corner is not how
     anybody plays. */
  function tapBoard(e) {
    if (!g || g.phase !== "roll" || g.side !== ME || busy) return;
    doRoll();
  }

  function tapPoint(pt) {
    if (!g || g.phase !== "move" || g.side !== ME || busy) return;
    const i = Nardi.indexOf(g, ME, pt);
    if (picked !== null) {
      const t = Nardi.targetsFrom(g, picked).find((x) => x.to === i);
      if (t) { play(picked, t.die); return; }
    }
    // picking up: only a stack of your own that has somewhere to go
    if (Nardi.legalMoves(g).some((m) => m.from === i)) { picked = i; highlight(); return; }
    picked = null; highlight();
  }

  function tapBar() {
    if (!g || g.phase !== "move" || g.side !== ME || busy) return;
    if (Nardi.legalMoves(g).some((m) => m.from === Nardi.BAR)) { picked = Nardi.BAR; highlight(); }
  }

  function tapOff() {
    if (picked === null) return;
    const t = Nardi.targetsFrom(g, picked).find((x) => x.to === "off");
    if (t) play(picked, t.die);
  }

  function play(from, die) {
    const was = g.side;
    Nardi.move(g, from, die);
    picked = null;
    if (Sound) Sound.play("place");
    draw();
    if (g.phase === "roundOver" || g.phase === "over") { finish(); return; }
    if (g.side !== was) { say(""); clearDice(true); setTimeout(cpuTurn, 620); }
  }

  /* ---------------- the computer ---------------- */
  async function cpuTurn() {
    if (!g || g.phase === "over" || g.side !== CPU) return;
    busy = true; draw();
    if (g.phase === "roll") {
      const rolled = Nardi.roll(g);
      shownValues = rolled;
      draw();
      await throwDice(shownValues, false);
      draw();
      if (g.side === ME) { busy = false; say("კომპიუტერს სვლა არ ჰქონდა"); draw(); return; }
    }
    const plan = Nardi.bestTurn(g);
    let k = 0;
    (function next() {
      if (!plan[k] || g.phase !== "move" || g.side !== CPU) {
        if (g.phase === "move" && g.side === CPU) Nardi.endTurn(g);
        busy = false;
        clearDice(true);
        draw();
        if (g.phase === "roundOver" || g.phase === "over") finish();
        return;
      }
      const m = plan[k++];
      Nardi.move(g, m.from, m.die);
      if (Sound) Sound.play("place");
      draw();
      if (g.phase === "roundOver" || g.phase === "over") { busy = false; finish(); return; }
      setTimeout(next, 420);
    })();
  }

  /* ---------------- rounds and the match ---------------- */
  function finish() {
    const won = g.roundWinner === ME;
    const what = g.roundWorth >= 3 ? "კოკა" : g.roundWorth === 2 ? "მარსი" : "";
    if (g.phase === "over") {
      show(g.matchWinner === ME ? "მოიგე!" : "წააგე",
        "ანგარიში " + g.scores[ME] + " : " + g.scores[CPU]);
      if (g.matchWinner === ME && window.Fx) Fx.confetti();
      return;
    }
    show(won ? "პარტია შენია" : "პარტია კომპიუტერს",
      (what ? what + " — " : "") + "+" + g.roundWorth +
      " · ანგარიში " + g.scores[ME] + " : " + g.scores[CPU]);
    setTimeout(() => {
      hide();
      Nardi.nextRound(g);
      draw();
      if (g.side === CPU) setTimeout(cpuTurn, 500);
    }, 2200);
  }

  function show(title, text) {
    document.getElementById("resTitle").textContent = title;
    document.getElementById("resText").textContent = text;
    document.getElementById("resultOverlay").classList.add("show");
  }
  const hide = () => document.getElementById("resultOverlay").classList.remove("show");
  const say = (t) => { document.getElementById("msg").textContent = t; };

  function startMatch() {
    hide();
    g = Nardi.newGame({ variant: VARIANT, target: TARGET });
    picked = null; busy = false;
    say("");                 // the bar is for what happens, not for the title
    build(); fit(); clearDice(false); draw();
    if (g.side === CPU) setTimeout(cpuTurn, 600);
  }

  function toggleSound() {
    const on = Sound.toggle();
    document.getElementById("sndBtn").textContent = on ? "🔊" : "🔇";
  }

  document.querySelector(".boardWrap").addEventListener("click", tapBoard);
  addEventListener("resize", () => { fit(); draw(); });
  /* The first measurement is taken before the fonts have landed and before the
     browser has decided how much of the screen it is keeping for itself, so it
     is usually wrong by a little and sometimes wrong by a lot. Watching the box
     is more honest than guessing when it has settled. */
  /* Kept in a variable on purpose: an observer nobody holds a reference to can
     be collected, and then the board silently stops following its box. */
  let boardWatch = null;
  if (window.ResizeObserver) {
    boardWatch = new ResizeObserver(() => fit());
    boardWatch.observe(document.querySelector(".boardWrap"));
  }
  startMatch();
  </script>
</body>
</html>
