<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ნარდი — კომპიუტერთან</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f5230" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/board.css" />
  <script src="js/progress.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/fullscreen.js"></script>
</head>
<body>
  <div class="stage">
    <div class="top">
      <button class="back" onclick="location.href='index.html'">←</button>
      <!-- Who is playing, one at each end of the bar, the way the two chairs
           face each other. Mine carries the purse; the other one does not,
           because another player's money is not mine to look at. -->
      <div class="seatPlate me" id="seatMe">
        <span class="avatar"><span class="face" id="meFace"></span>
          <span class="rank" id="meLevel">1</span></span>
        <span class="who"><b id="meName">—</b><i id="meCoins" class="purse"></i></span>
      </div>
      <div class="info">
        <span class="stat"><span class="k">ანგარიში</span><b id="scoreLbl">0 : 0</b></span>
        <span class="stat pipStat"><span class="dot w"></span><b id="myPip">—</b></span>
        <span class="stat pipStat"><span class="dot b"></span><b id="cpuPip">—</b></span>
        <span class="badge">პრაქტიკა</span>
      <span class="stat cubeStat" id="cubeStat" style="display:none"><b id="cubeVal">×2</b></span>
      </div>
      <div class="bStat">
        <span class="dot" id="turnDot"></span>
        <span id="turnName">შენი სვლა</span>
      </div>
      <div class="msg" id="msg"></div>
      <div class="spacer" style="flex:1 1 auto"></div>
      <div class="seatPlate them" id="seatThem">
        <span class="who"><b id="themName">—</b><i id="themNote"></i></span>
        <span class="avatar"><span class="face" id="themFace"></span>
          <span class="rank" id="themLevel"></span></span>
      </div>
      <button class="back sndBtn" id="sndBtn" onclick="toggleSound()" title="ხმა"></button>
      <button class="newgame" onclick="startMatch()">ახალი თამაში</button>
    </div>

    <div class="boardWrap">
      <div class="boardFrame" id="frame">
        <div class="nboard" id="board"></div>
        <div class="diceLayer" id="diceLayer"></div>
        <!-- The controls sit ON the board, in the empty band between the point
             tips, where no checker ever stands. A column down the side would
             cost the board width a phone has none of. They are two buttons
             that change what they are, and each one is there only when it can
             be used: ×2 goes the moment the dice are thrown, უკან arrives with
             the first move, and მზადაა waits for the last one. -->
        <div class="sidePanel">
          <button class="sideBtn alt" id="btnAlt"><b id="btnAltText">×2</b></button>
          <button class="sideBtn main" id="btnMain"><b id="btnMainText">გააგორე</b></button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="waitOverlay">
    <div class="modal">
      <h2 id="waitTitle">ველოდებით მოწინააღმდეგეს…</h2>
      <p id="waitText"></p>
      <div class="code" id="codeBox" style="display:none"><b id="codeVal"></b></div>
      <div class="modalActions">
        <button class="alt" onclick="leaveTable()">გასვლა</button>
      </div>
    </div>
  </div>

  <!-- The cube. One side offers to play for twice as much; the other takes it
       or gives the match up at what it is worth now. There is no third answer,
       which is the whole point of a doubling cube. -->
  <div class="overlay" id="cubeOverlay">
    <div class="modal">
      <h2 id="cubeTitle">ფსონის გაორმაგება</h2>
      <p id="cubeText"></p>
      <div class="modalActions" id="cubeAsk">
        <button onclick="answerDouble(true)">დათანხმება</button>
        <button class="alt" onclick="answerDouble(false)">გასვლა</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="modal">
      <h2 id="resTitle">—</h2>
      <p id="resText"></p>
      <div class="modalActions">
        <button onclick="startMatch()">ახალი თამაში</button>
        <button class="alt" onclick="location.href='index.html'">გასვლა</button>
      </div>
    </div>
  </div>

  <script src="js/woodgrain.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/nardi.js"></script>
  <script src="js/coins.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/socket.io.min.js"></script>
  <script src="js/leaving.js"></script>
  <script>
  /* =====================================================================
     ნარდი, against the computer.

     The engine holds the whole of the rules; this file only draws what it says
     and hands back the two things a player does — roll, and move a checker
     from one point to another.

     The board is laid out the way every ნარდი board is: the bottom row runs
     0..11 from the right, the top row 12..23 from the left, so a player's
     journey is one lap anticlockwise. Which lap it is depends on the game, and
     that lives in the engine, not here.
     ===================================================================== */
  const P = new URLSearchParams(location.search);
  const VARIANT = P.get("v") === "short" ? "short" : "long";
  const TARGET = [1, 3, 5, 7].includes(+P.get("target")) ? +P.get("target") : 3;
  /* One screen, two ways of playing. Against the computer the engine here is
     the game; online the SERVER is the game and the engine here is only used to
     work out what may be touched — it is the same file on both sides, so the
     two always agree about what is legal. */
  const MODE = ["quick", "friend", "join", "rejoin"].includes(P.get("mode")) ? P.get("mode") : "cpu";
  const ONLINE = MODE !== "cpu";
  let ME = 0, CPU = 1;
  let socket = null, seated = false, lastDice = null;
  const TOKEN = (function () {
    let t = localStorage.getItem("dominoToken");
    if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36);
              localStorage.setItem("dominoToken", t); }
    return t;
  })();

  let g = null;
  let picked = null;        // the track index a checker is being dragged from
  let busy = false;         // the computer is thinking; the board is not yours
  /* Every move of your own turn, as the board looked before it. A turn is not
     over until you say it is, so until then every one of them can be taken
     back. Online the server keeps the same pile and this only counts it. */
  let hist = [];
  let undoLeft = 0;
  let mayDouble = false;    // the cube is mine to offer and it is the moment to
  let stakeMul = 1;         // what the match is worth, in stakes

  document.title = (VARIANT === "short" ? "კლასიკური ნარდი" : "გრძელი ნარდი") + " — კომპიუტერთან";

  /* =====================================================================
     Throwing the dice.

     Two bone cubes, thrown from off the edge of the board into the near half,
     tumbling as they go and bouncing once when they land. The engine has
     already decided what they say — the throw only has to end with those faces
     pointing at the player, which is a rotation plus a few whole turns on the
     way there.

     A face is shown by turning the cube so that face is at the front. The six
     rotations are the inverses of where the faces were built.
     ===================================================================== */
  const FACE_TURN = {
    1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0],
  };
  // which of the nine cells a face's pips occupy
  const PIPS = {
    1: ["d"], 2: ["a", "g"], 3: ["a", "d", "g"],
    4: ["a", "b", "f_", "g"], 5: ["a", "b", "d", "f_", "g"],
    6: ["a", "b", "c", "e", "f_", "g"],
  };

  function makeDie() {
    const d = document.createElement("div");
    d.className = "d3";
    for (let f = 1; f <= 6; f++) {
      const face = document.createElement("div");
      face.className = "f f" + f;
      face.innerHTML = PIPS[f].map((p) => '<i class="' + p + '"></i>').join("");
      d.appendChild(face);
    }
    return d;
  }

  /* Where the dice come to rest. Each player throws into their own half of the
     board and from their own side of the table, the way two people sitting
     opposite each other do — so you can tell whose throw it was without being
     told. */
  function restingPlace(i, n, mine) {
    const layer = document.getElementById("diceLayer");
    const W = layer.clientWidth, H = layer.clientHeight;
    const ds = dieSize();
    const spread = ds * 1.25;
    const cx = W * (mine ? 0.72 : 0.28) - (n - 1) * spread / 2 + i * spread;
    const cy = H * 0.52;
    return [cx - ds / 2 + (Math.random() - 0.5) * ds * 0.18,
            cy - ds / 2 + (Math.random() - 0.5) * ds * 0.5];
  }
  function dieSize() {
    const b = document.getElementById("board");
    return Math.max(22, parseFloat(getComputedStyle(b).getPropertyValue("--cd")) * 1.05);
  }

  /* The board is measured from the space it is given, and that space changes:
     the phone turns, the address bar slides away, the window is dragged. The
     checkers are redrawn from the game each time — the dice are not, so they
     are told where to lie again, as a fraction of the board rather than in
     pixels of the board it used to be. */
  function placeDice() {
    const layer = document.getElementById("diceLayer");
    if (!layer) return;
    const ds = dieSize();
    layer.style.setProperty("--ds", ds + "px");
    const W = layer.clientWidth, H = layer.clientHeight;
    diceEls.forEach((d) => {
      if (!d.rest) return;
      d.style.transform = `translate3d(${d.rest.fx * W}px, ${d.rest.fy * H}px, 0)` +
        ` rotateX(${d.rest.rx}deg) rotateY(${d.rest.ry}deg) scale(1)`;
    });
  }

  let diceEls = [];
  function clearDice(fade) {
    const layer = document.getElementById("diceLayer");
    if (!layer) return;
    if (!fade) { layer.innerHTML = ""; diceEls = []; return; }
    diceEls.forEach((d) => d.classList.add("gone"));
    const old = diceEls; diceEls = [];
    setTimeout(() => old.forEach((d) => d.remove()), 300);
  }

  /* Throw `values` onto the board. Resolves when they have settled, so the
     turn can wait for them rather than racing them. */
  function throwDice(values, mine) {
    return new Promise((done) => {
      const layer = document.getElementById("diceLayer");
      clearDice(false);
      const ds = dieSize();
      layer.style.setProperty("--ds", ds + "px");
      const W = layer.clientWidth, H = layer.clientHeight;
      const DUR = 820;

      /* A throw needs the animation to actually run. It does not when the tab
         is in the background — a locked phone, another app — and it should not
         when the player has asked their system for less movement. In both cases
         the dice are simply put down where they belong: the alternative is an
         animation frozen at frame one, holding two dice off the edge of the
         board until the player comes back. */
      const still = document.hidden ||
        (matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
      const running = [];

      if (Sound) Sound.play(still ? "diceLand" : "diceShake", DUR / 1000);
      values.forEach((v, i) => {
        const d = makeDie();
        layer.appendChild(d);
        diceEls.push(d);
        const [x1, y1] = restingPlace(i, values.length, mine);
        // in from beyond the edge on the thrower's side, low and fast
        const x0 = mine ? W + ds * (1.2 + i * 0.5) : -ds * (1.2 + i * 0.5);
        const y0 = H * (0.18 + Math.random() * 0.2);
        const xm = x1 + (x0 - x1) * 0.42, ym = y1 - H * 0.16 - i * 6;
        const [fx, fy] = FACE_TURN[v];
        const turns = 2 + Math.floor(Math.random() * 2);
        const rx = fx + 360 * turns, ry = fy - 360 * (turns + 1);
        const at = (x, y, sx, sy, s) =>
          `translate3d(${x}px, ${y}px, 0) rotateX(${sx}deg) rotateY(${sy}deg) scale(${s})`;

        /* Where it ends up is written on the die itself, and the throw is
           played over the top of that. A browser that never runs the animation
           — a tab in the background while the phone is locked — then still has
           the dice lying in the right place when the player looks again,
           instead of stuck off the edge where they were thrown from. */
        d.rest = { fx: x1 / W, fy: y1 / H, rx, ry };
        d.style.transform = at(x1, y1, rx, ry, 1);

        if (still) return;
        running.push(d.animate([
          { transform: at(x0, y0, 0, 0, 0.7), offset: 0 },
          { transform: at(xm, ym, rx * 0.55, ry * 0.55, 1.12), offset: 0.42 },
          { transform: at(x1, y1 + ds * 0.05, rx * 0.9, ry * 0.9, 1), offset: 0.72 },
          // the bounce: up a little, then down for good
          { transform: at(x1 + ds * 0.06, y1 - ds * 0.3, rx * 0.97, ry * 0.97, 1), offset: 0.85 },
          { transform: at(x1, y1, rx, ry, 1), offset: 1 },
        ], { duration: DUR + i * 90, easing: "cubic-bezier(.22,.62,.3,1)" }));
      });

      const double = values.length === 2 && values[0] === values[1];
      if (still) {
        if (double && Sound) Sound.play("diceDouble");
        setTimeout(done, 60);
        return;
      }
      // the clatter lands with the first die, not with the animation's end
      setTimeout(() => { if (Sound) Sound.play("diceLand"); }, DUR * 0.72);
      setTimeout(() => {
        /* And when the throw is over, the animation is taken away — whether it
           ran or not. A browser that never advanced it would otherwise hold the
           dice at frame one, off the edge of the board, for good. With it gone
           they fall back to the transform written on them, which is where they
           were always going to land. Timers advance where animations sometimes
           do not, so this is the belt to that pair of braces. */
        running.forEach((a) => { try { a.cancel(); } catch (e) { /* already gone */ } });
        if (double && Sound) Sound.play("diceDouble");
        done();
      }, DUR + (values.length - 1) * 90 + 160);   // a margin, so a busy main
      // thread never has its animation cut off mid-bounce
    });
  }

  /* Dim the ones already played, so the board says what is left without being
     asked. On a double there are four moves in two dice, so both stay lit until
     fewer moves remain than there are dice lying there. */
  function markSpent() {
    if (!g || !g.dice) return;
    const left = g.left.slice();
    diceEls.forEach((d, i) => {
      const v = shownValues[i];
      const k = left.indexOf(v);
      if (k >= 0) { left.splice(k, 1); d.classList.remove("spent"); }
      else d.classList.add("spent");
    });
  }
  let shownValues = [];

  /* ---------------- drawing ---------------- */
  /* A ნარდი board is a case hinged down the MIDDLE, and it opens like a book:
     a left half and a right half, not a top and a bottom. So that is how it is
     built — two halves either side of the seam, each holding its own six points
     above and six below. Getting this wrong is what made the opening look like
     a lid instead of a board.

     Points, left to right: the top row runs 12..23, the bottom row 11..0. The
     left half therefore holds 12..17 over 11..6, and the right half 18..23 over
     5..0. */
  function build() {
    const b = document.getElementById("board");
    b.innerHTML = "";
    /* Every player sits in front of their own home. The slots on screen never
       move; which point of the board each slot IS depends on which chair you
       are in. Seat one sees the board turned about — in გრძელი ნარდი that is a
       half turn, in მოკლე ნარდი a reflection, because the two games put their
       home boards in different corners. */
    const mine = (slot) => ME === 0 ? slot
      : (VARIANT === "short" ? 23 - slot : (slot + 12) % 24);
    const mkPoint = (slot) => {
      const pt = mine(slot);
      const d = document.createElement("div");
      d.className = "npt" + (pt % 2 ? " odd" : "");
      d.dataset.pt = pt;
      d.innerHTML = '<span class="tri"></span>';
      d.onclick = () => { if (swallowClick) { swallowClick = false; return; } tapPoint(pt); };
      return d;
    };
    const row = (kind, from, to) => {
      const r = document.createElement("div");
      r.className = "nrow " + kind;
      const step = from <= to ? 1 : -1;
      for (let pt = from; step > 0 ? pt <= to : pt >= to; pt += step) r.appendChild(mkPoint(pt));
      return r;
    };
    /* A half has two faces. The board is on the inside; the outside is the
       carved case you see before it is opened — which is the whole point of
       opening it. Both hide their own backs, so turning the half over shows
       the other one without anything being switched on or off. */
    const half = (which, top, bot) => {
      const h = document.createElement("div");
      h.className = "nhalf " + which;
      const inside = document.createElement("div");
      inside.className = "face inside";
      // the field is a piece of timber, and the points are cut into it
      if (window.Wood) Wood.fill(inside, "wgField");
      inside.appendChild(top); inside.appendChild(bot);
      const outside = document.createElement("div");
      outside.className = "face outside";
      outside.innerHTML =
        '<div class="lid">' +
        '  <span class="lidBorder"></span>' +
        '  <span class="lidVine"></span>' +
        '  <span class="lidCross"></span>' +
        '  <b class="lidTitle">საქართველო</b>' +
        '  <span class="lidMap"></span>' +
        "</div>";
      h.appendChild(inside); h.appendChild(outside);
      return h;
    };

    const left = half("left", row("ntop", 12, 17), row("nbot", 11, 6));
    const right = half("right", row("ntop", 18, 23), row("nbot", 5, 0));

    /* The seam: the hinges, and in მოკლე ნარდი the bar a hit checker waits on.
       Two halves of it keep their old names, so the rest of the screen does not
       have to know the board was rebuilt. */
    const mid = document.createElement("div");
    mid.className = "nmid";
    if (window.Wood) Wood.fill(mid, "wgSpine");
    mid.innerHTML = '<span class="hinge"></span>' +
      '<div class="barHalf" id="midT"></div><div class="barHalf" id="midB"></div>' +
      '<span class="hinge"></span>';
    mid.onclick = () => { if (swallowClick) { swallowClick = false; return; } tapBar(); };

    /* The wall between the field and the tray. A real case has one: the borne
       off checkers sit in their own compartment behind a raised rail. Without
       it that strip reads as more board, and a checker put there looks dropped
       rather than put away. */
    const divider = document.createElement("div");
    divider.className = "ndiv";

    const tray = document.createElement("div"); tray.className = "ntray"; tray.id = "tray";
    /* and the cross-piece inside it: one player's checkers above, the other's
       below, so a full tray is two players' worth and not one heap */
    tray.innerHTML = '<div class="half" id="offTop"></div>' +
      '<div class="tdiv"></div>' +
      '<div class="half bottom" id="offBot"></div>';
    tray.onclick = () => { if (swallowClick) { swallowClick = false; return; } tapOff(); };

    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    const cols = document.createElement("div");
    cols.className = "nrows";
    cols.style.flex = "1 1 auto"; cols.style.minWidth = "0";
    cols.appendChild(left); cols.appendChild(mid); cols.appendChild(right);
    wrap.appendChild(cols); wrap.appendChild(divider); wrap.appendChild(tray);
    b.appendChild(wrap);
    /* The case is built once and rebuilt whenever the seat changes, so the
       timber goes in only if it is not there already. */
    const fr = document.getElementById("frame");
    if (window.Wood && fr && !fr.querySelector("svg.grain")) Wood.fill(fr, "wgCase");
  }

  /* How big everything is. Measured from the space the board is actually
     given, never assumed: fifteen checkers have to fit on one point in
     გრძელი ნარდი, so a point is five checkers tall and the rest overlap. */
  function fit() {
    const wrap = document.querySelector(".boardWrap");
    const frame = document.getElementById("frame");
    let availW = wrap.clientWidth - 4;
    const availH = wrap.clientHeight - 4;
    if (availW < 40 || availH < 40) return;



    /* The rail is part of the board, not a border round it. A real case has a
       wide walnut edge with the ornament cut into it — at eight pixels there was
       nowhere to cut anything, and the whole thing read as a sheet of paper.
       The sides are wider than the top and bottom, which is how they are made:
       that is where a hand rests and where the carving goes. */
    const side = Math.max(15, Math.min(availH * 0.115, availW * 0.06));
    const pad = Math.max(9, side * 0.6);
    const trayF = 0.062, barF = 0.075, dvF = 0.03;
    /* A checker has to sit INSIDE its point, not straddle it. The point is very
       nearly the full width of its column and the checker is four fifths of
       that, so a stroke of the inlay shows either side of every piece. Five of
       them fill the point exactly, which is what a real board looks like.
       1.5 is where those two hold at once: any narrower and the checkers are
       pinched by the width, any wider and they are pinched by the height. */
    const boardH = Math.min(availH - pad * 2, (availW - side * 2) / 1.55);
    const boardW = boardH * 1.55;
    const inner = boardW * (1 - trayF - barF - dvF);
    const cd = Math.min(inner / 12 * 0.80, boardH / 2 / 5.8);
    const rowH = boardH / 2;

    frame.style.setProperty("--frameP", pad + "px");
    frame.style.setProperty("--frameS", side + "px");
    const b = document.getElementById("board");
    b.style.width = boardW + "px";
    b.style.setProperty("--rowH", rowH + "px");
    b.style.setProperty("--cd", cd + "px");
    b.style.setProperty("--barW", (boardW * barF) + "px");
    b.style.setProperty("--trayW", (boardW * trayF) + "px");
    b.style.setProperty("--dvW", (boardW * dvF) + "px");

    /* Where the buttons stand: on the seam, halfway up. The band between the
       point tips is empty on every board — a point holds five checkers and
       stops short of it — and the seam is the one line across it where no
       ornament is cut either, so nothing at all is hidden behind them. */
    const seam = (inner + boardW * barF) / 2;
    frame.style.setProperty("--ctlX", (side + seam) + "px");
    frame.style.setProperty("--ctlY", (pad + boardH / 2) + "px");
    /* The gap between the opposing point tips is 24% of a row, and the buttons
       have to fit INSIDE it: on a phone the innermost point carries five
       checkers right up to the seam, and a pill a pixel too tall sits on them. */
    frame.style.setProperty("--ctlH", Math.max(18, Math.min(boardH * 0.100, 44)) + "px");
    placeDice();                 // the dice lie on the board, so they move with it
  }

  function draw() {
    if (!g) return;
    const seen = g.pts;
    document.querySelectorAll(".npt").forEach((el) => {
      const pt = +el.dataset.pt;
      el.className = "npt" + (pt % 2 ? " odd" : "");
      el.querySelectorAll(".chk").forEach((c) => c.remove());
      const n = Math.abs(seen[pt]);
      if (!n) return;
      const side = seen[pt] > 0 ? 0 : 1;
      const cd = parseFloat(getComputedStyle(document.getElementById("board")).getPropertyValue("--cd"));
      /* A stack has to fit the POINT, not the row: five checkers with a
         fixed gap between them came to more than the point was long on a
         small screen, and the fifth stuck out past the tip into the middle
         band where the buttons stand. The gap is worked out from the room
         there is, so five always fill the point exactly and no more. */
      const room = rowH() * 0.865;                       // the length of a point
      const clear = Math.max(0, (room - cd * 5) / 4);
      const gap = n <= 5 ? clear : (room - cd) / (n - 1) - cd;
      for (let i = 0; i < n; i++) {
        const c = document.createElement("div");
        c.className = "chk " + (side === 0 ? "w" : "b");
        c.style.setProperty("--chkGap", (i === 0 ? 0 : gap) + "px");
        if (n > 5 && i === n - 1) c.innerHTML = '<span class="more">' + n + "</span>";
        el.appendChild(c);
      }
    });

    // the bar
    ["T", "B"].forEach((k) => {
      const m = document.getElementById("mid" + k);
      m.innerHTML = ""; m.className = "barHalf";   // its own class, not the seam's
    });
    for (const side of [0, 1]) {
      const m = document.getElementById(side === ME ? "midB" : "midT");
      for (let i = 0; i < g.bar[side]; i++) {
        const c = document.createElement("div");
        c.className = "barChk chk " + (side === 0 ? "w" : "b");
        m.appendChild(c);
      }
    }
    // the tray
    const trays = {};
    trays[ME] = document.getElementById("offBot");
    trays[CPU] = document.getElementById("offTop");
    for (const side of [0, 1]) {
      trays[side].innerHTML = "";
      for (let i = 0; i < g.off[side]; i++) {
        const d = document.createElement("div");
        d.className = "off " + (side === 0 ? "w" : "b");
        trays[side].appendChild(d);
      }
    }

    markSpent();       // the dice are on the board; they only need dimming

    // the target rides along with the score rather than taking a plate of its
    // own: the bar already carries a turn, a pair of dice and a roll button
    document.getElementById("scoreLbl").textContent =
      g.scores[ME] + " : " + g.scores[CPU] + "  → " + g.target;
    document.getElementById("myPip").textContent = Nardi.pipCount(g, ME);
    document.getElementById("cpuPip").textContent = Nardi.pipCount(g, CPU);
    document.getElementById("turnDot").className = "dot " + (g.side === 0 ? "w" : "b");
    document.getElementById("turnName").textContent =
      g.phase === "over" ? "მატჩი დასრულდა"
      : g.side === ME ? (g.phase === "roll" ? "შენი გაგორებაა" : "შენი სვლა")
      : "კომპიუტერი";
    controls();
    seatPlates();
    const cs = document.getElementById("cubeStat");
    cs.style.display = stakeMul > 1 ? "" : "none";
    document.getElementById("cubeVal").textContent = "×" + stakeMul;
    highlight();
  }

  /* what the player may touch right now */
  function highlight() {
    document.querySelectorAll(".npt.can, .npt.from, .npt.pick")
      .forEach((e) => e.classList.remove("can", "from", "pick"));
    document.getElementById("tray").classList.remove("can");
    ["midT", "midB"].forEach((k) => document.getElementById(k).classList.remove("can", "from"));
    if (!g || g.phase !== "move" || g.side !== ME || busy) return;

    /* Nothing is in the air: show every checker that has somewhere to go.
       Tapping one plays it; dragging one asks where. */
    if (picked === null) {
      const froms = new Set(Nardi.legalMoves(g).map((m) => m.from));
      froms.forEach((f) => {
        if (f === Nardi.BAR) document.getElementById("midB").classList.add("can");
        else ptEl(Nardi.pointAt(g, ME, f)).classList.add("pick");
      });
      return;
    }
    // one is being dragged: light everywhere it could come down
    if (picked === Nardi.BAR) document.getElementById("midB").classList.add("from");
    else ptEl(Nardi.pointAt(g, ME, picked)).classList.add("from");
    for (const t of Nardi.targetsFrom(g, picked)) {
      if (t.to === "off") document.getElementById("tray").classList.add("can");
      else ptEl(Nardi.pointAt(g, ME, t.to)).classList.add("can");
    }
  }

  /* ---------------- the two buttons ----------------
     One is a roll and then a full stop; the other is a stake and then a
     rubber. What each of them is depends only on the state of the board, so it
     is decided here and nowhere else. */
  function controls() {
    const main = document.getElementById("btnMain");
    const alt = document.getElementById("btnAlt");
    const mText = document.getElementById("btnMainText");
    const aText = document.getElementById("btnAltText");
    const mine = g && g.side === ME && !busy;
    const rolling = mine && g.phase === "roll";
    const moving = mine && g.phase === "move";

    mText.textContent = moving ? "მზადაა" : "გააგორე";
    aText.textContent = moving ? "უკან" : "×2";
    main.disabled = !(rolling || (moving && Nardi.turnOver(g)));
    alt.disabled = moving ? !undoCount() : !canDouble();
    /* A button nobody can press is a button in the way. On the felt there is
       no room for either, so they come and go instead of greying out — except
       მზადაა, which stays and dims, because it is the one thing a player is
       waiting to be allowed to do. */
    alt.style.display = alt.disabled ? "none" : "";
    main.style.display = (rolling || moving) ? "" : "none";
    main.classList.toggle("ready", moving && !main.disabled);
  }
  /* The two plates. Mine is filled from what this device already knows, so it
     is right before the first packet arrives; the other one waits for the
     server to say who sat down. */
  let opp = { name: "", pic: null, level: null, bot: false };
  let mine = { name: "", pic: null, level: null, coins: null };
  function seatPlates() {
    /* Offline this device is the only source there is; online the server is,
       because a level and a purse are its to say and not the browser's. */
    const acc = (window.Auth && Auth.load && Auth.load()) || {};
    const myName = mine.name || acc.name || "სტუმარი";
    face(document.getElementById("meFace"), mine.pic || acc.picture, myName);
    document.getElementById("meName").textContent = myName;
    const purse = mine.coins != null ? mine.coins
      : (window.Coins ? Coins.get() : null);
    document.getElementById("meCoins").textContent =
      purse == null ? "" : (window.Coins ? Coins.format(purse) : String(purse));
    rank(document.getElementById("meLevel"), mine.level);

    document.getElementById("themName").textContent =
      ONLINE ? (opp.name || "მოწინააღმდეგე") : "კომპიუტერი";
    document.getElementById("themNote").textContent =
      ONLINE && opp.bot ? "ავტომატურად თამაშობს" : "";
    rank(document.getElementById("themLevel"), ONLINE ? opp.level : null);
    face(document.getElementById("themFace"), ONLINE ? opp.pic : null,
         ONLINE ? (opp.name || "?") : "\u2699");
  }
  // a rank with no number is not a rank: the chip goes away rather than sit empty
  function rank(el, level) {
    el.textContent = level != null ? level : "";
    el.style.display = level != null ? "" : "none";
  }
  /* A picture if there is one, otherwise the first letter of the name cut into
     brass. Never a broken image: an avatar that fails to load is a hole in the
     table. The letter is left exactly as it was typed — Georgian has no
     capitals to raise it to, only მთავრული, which is unreadable at this size. */
  function face(el, pic, name) {
    if (pic) {
      el.style.backgroundImage = "url(\"" + String(pic).replace(/["\\]/g, "") + "\")";
      el.textContent = "";
      el.classList.add("hasPic");
    } else {
      el.style.backgroundImage = "";
      el.textContent = (name || "?").trim().charAt(0) || "?";
      el.classList.remove("hasPic");
    }
  }

  const undoCount = () => (ONLINE ? undoLeft : hist.length);
  // a stake needs somebody to win it: there is none against the computer
  const canDouble = () => ONLINE && mayDouble;
  const ptEl = (pt) => document.querySelector('.npt[data-pt="' + pt + '"]');
  const rowH = () => parseFloat(getComputedStyle(document.getElementById("board"))
    .getPropertyValue("--rowH")) || 0;

  /* ---------------- what the player does ---------------- */
  function mainAction() {
    if (!g || g.side !== ME || busy) return;
    if (g.phase === "roll") doRoll();
    else if (g.phase === "move" && Nardi.turnOver(g)) doneTurn();
  }
  function altAction() {
    if (!g || g.side !== ME || busy) return;
    if (g.phase === "move") undoMove();
    else if (canDouble()) socket.emit("nDouble");
  }

  function answerDouble(take) {
    show(document.getElementById("cubeOverlay"), false);
    if (socket) socket.emit("nDoubleAnswer", { take: !!take });
  }

  /* The turn is over when the player says so, not when the last die is spent.
     Everything between the roll and this is provisional. */
  function doneTurn() {
    if (ONLINE) { socket.emit("nDone"); return; }
    if (!g || g.phase !== "move" || g.side !== ME || !Nardi.turnOver(g)) return;
    hist = [];
    Nardi.endTurn(g);
    say(""); clearDice(true); draw();
    setTimeout(cpuTurn, 620);
  }

  function undoMove() {
    if (ONLINE) { socket.emit("nUndo"); return; }
    if (!hist.length) return;
    g = JSON.parse(hist.pop());
    picked = null;
    if (Sound) Sound.play("place");
    draw();
  }

  /* A throw is not instant, so the turn waits for it. `busy` holds the board
     shut while the dice are in the air — otherwise a fast tap could move a
     checker with a die that has not landed yet. */
  async function doRoll() {
    if (!g || g.phase !== "roll" || g.side !== ME || busy) return;
    if (ONLINE) { socket.emit("nRoll"); return; }   // the server throws them
    busy = true;
    const rolled = Nardi.roll(g);
    /* Two dice are thrown, and two land, even on a double — a double is worth
       four moves, not four dice. The player was clear: if there are two in your
       hand, four on the table make no sense. */
    shownValues = rolled;
    draw();
    await throwDice(shownValues, true);
    busy = false;
    say(g.log || "");
    draw();
    if (g.side !== ME) setTimeout(cpuTurn, 700);
  }

  /* Tapping the felt throws them, the same as the button does. On a board you
     roll onto the board, and reaching for a button in the corner is not how
     anybody plays. */
  function tapBoard(e) {
    if (e && e.target && e.target.closest(".sidePanel")) return;
    if (!g || g.phase !== "roll" || g.side !== ME || busy) return;
    doRoll();
  }

  const myTurn = () => !!g && g.phase === "move" && g.side === ME && !busy;

  /* ---------------- dragging a checker ----------------
     A tap plays the bigger die. When that is not the one you wanted, you pick
     the checker up and put it where you mean, and the die is whichever one
     reaches that point. The two share a single pointer handler, because a tap
     is only a drag that did not go anywhere: below the threshold the click
     falls through to tapPoint, above it the click is swallowed. */
  const DRAG_SLOP = 8;
  let dragFrom = null, dragGhost = null, dragAt = null, dragging = false;
  let swallowClick = false;

  function whereIs(e) {
    if (dragGhost) dragGhost.style.visibility = "hidden";
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (dragGhost) dragGhost.style.visibility = "";
    if (!el) return null;
    if (el.closest("#tray")) return "off";
    if (el.closest(".nmid")) return Nardi.BAR;
    const p = el.closest(".npt");
    return p ? Nardi.indexOf(g, ME, +p.dataset.pt) : null;
  }

  function ghostFor(i) {
    const src = i === Nardi.BAR ? null
      : ptEl(Nardi.pointAt(g, ME, i)).querySelector(".chk:last-child");
    const d = document.createElement("div");
    d.className = "chk dragGhost " + (ME === 0 ? "w" : "b");
    if (src) d.className = src.className + " dragGhost";
    document.body.appendChild(d);
    return d;
  }

  function onDown(e) {
    swallowClick = false;
    if (!myTurn() || e.button > 0) return;
    const i = whereIs(e);
    if (i === null || i === "off") return;
    if (!Nardi.legalMoves(g).some((m) => m.from === i)) return;
    dragFrom = i; dragAt = { x: e.clientX, y: e.clientY }; dragging = false;
  }

  function onMove(e) {
    if (dragFrom === null) return;
    const far = Math.abs(e.clientX - dragAt.x) + Math.abs(e.clientY - dragAt.y);
    if (!dragging) {
      if (far < DRAG_SLOP) return;
      dragging = true;
      picked = dragFrom;
      highlight();
      dragGhost = ghostFor(dragFrom);
    }
    dragGhost.style.left = e.clientX + "px";
    dragGhost.style.top = e.clientY + "px";
  }

  function onUp(e) {
    const from = dragFrom, moved = dragging;
    dragFrom = null; dragging = false;
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    if (from === null || !moved) { picked = null; highlight(); return; }
    swallowClick = true;                 // the click that follows is not a tap
    const to = whereIs(e);
    picked = null;
    const t = to === null ? null : Nardi.targetsFrom(g, from).find((x) => x.to === to);
    if (t) play(from, t.die); else highlight();
  }

  /* Touching one of your own checkers plays it, with the BIGGEST die that can
     go. Touch it again where it lands and the next one goes. Six then three,
     not whichever the app felt like — which makes an ordinary turn two taps
     and no aiming at all. When you want the other die, you drag instead. */
  function tapPoint(pt) {
    if (!myTurn()) return;
    const i = Nardi.indexOf(g, ME, pt);
    const from = Nardi.legalMoves(g).filter((m) => m.from === i);
    if (from.length) {
      from.sort((a, b) => b.die - a.die);
      play(i, from[0].die);
      return;
    }
    /* Nothing of yours here — but you may have meant "go there". Where several
       could reach it, the one furthest from home goes: that is the convention,
       and it is the one that needs the help. */
    const going = Nardi.legalMoves(g).filter((m) => m.from + m.die === i);
    if (going.length) {
      going.sort((a, b) => a.from - b.from);
      play(going[0].from, going[0].die);
    }
  }

  function tapBar() {
    if (!myTurn()) return;
    const from = Nardi.legalMoves(g).filter((m) => m.from === Nardi.BAR);
    if (!from.length) return;
    from.sort((a, b) => b.die - a.die);
    play(Nardi.BAR, from[0].die);
  }

  function tapOff() {
    if (!myTurn()) return;
    const off = Nardi.legalMoves(g).filter((m) => m.from + m.die >= Nardi.POINTS);
    if (!off.length) return;
    off.sort((a, b) => (a.from - b.from) || (b.die - a.die));
    play(off[0].from, off[0].die);
  }

  function play(from, die) {
    if (ONLINE) { socket.emit("nMove", { from, die }); picked = null; highlight(); return; }
    hist.push(JSON.stringify(g));
    Nardi.move(g, from, die, true);      // held open: the turn ends on მზადაა
    picked = null;
    if (Sound) Sound.play("place");
    draw();
    if (g.phase === "roundOver" || g.phase === "over") { hist = []; finish(); return; }
    // a roll with nothing playable ends the turn inside the engine
    if (g.side !== ME) { hist = []; say(""); clearDice(true); setTimeout(cpuTurn, 620); return; }
    /* Dice left that the board will not take: they are thrown away for him.
       Nobody should have to press a button to agree that they are stuck. */
    if (Nardi.stuck(g)) {
      say("სვლა აღარ არის");
      busy = true; draw();
      setTimeout(() => { busy = false; doneTurn(); }, 900);
    }
  }

  /* ---------------- the computer ---------------- */
  async function cpuTurn() {
    if (!g || g.phase === "over" || g.side !== CPU) return;
    busy = true; draw();
    if (g.phase === "roll") {
      const rolled = Nardi.roll(g);
      shownValues = rolled;
      draw();
      await throwDice(shownValues, false);
      draw();
      if (g.side === ME) { busy = false; say("კომპიუტერს სვლა არ ჰქონდა"); draw(); return; }
    }
    const plan = Nardi.bestTurn(g);
    let k = 0;
    (function next() {
      if (!plan[k] || g.phase !== "move" || g.side !== CPU) {
        if (g.phase === "move" && g.side === CPU) Nardi.endTurn(g);
        busy = false;
        clearDice(true);
        draw();
        if (g.phase === "roundOver" || g.phase === "over") finish();
        return;
      }
      const m = plan[k++];
      Nardi.move(g, m.from, m.die);
      if (Sound) Sound.play("place");
      draw();
      if (g.phase === "roundOver" || g.phase === "over") { busy = false; finish(); return; }
      setTimeout(next, 420);
    })();
  }

  /* =====================================================================
     Sitting down at the board.

     The case is laid open, and then the checkers are set out one after another
     — which is what anybody does before a game, and it is worth watching once.
     `layOut` gives every checker its place in the queue; the CSS does the rest.

     Nothing here is allowed to be load-bearing. If the animations do not run —
     a background tab, a system asking for less movement — the board is simply
     there, already open, with the checkers on it.
     ===================================================================== */
  const INTRO_FOLD = 1500, INTRO_STEP = 34;

  function layOut() {
    const chks = [...document.querySelectorAll("#board .chk")];
    chks.forEach((c, i) => c.style.setProperty("--i", i));
    return chks.length;
  }

  function stillness() {
    return document.hidden ||
      (matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  /* `withCase` opens the board as well; a new round inside a match only needs
     the checkers set out again. Resolves when the table is ready to play. */
  function intro(withCase) {
    return new Promise((done) => {
      const b = document.getElementById("board");
      const n = layOut();
      if (stillness()) { done(); return; }

      const dealFor = n * INTRO_STEP + 300;
      if (withCase) {
        b.classList.add("opening");
        if (Sound) Sound.play("boardOpen");
        setTimeout(() => b.classList.remove("opening"), INTRO_FOLD + 120);
      }
      setTimeout(() => {
        b.classList.add("dealing");
        layOut();                       // the class arrived after the checkers did
        // a light tick every few, so it sounds like a handful being set out
        // rather than a drum roll
        for (let i = 0; i < n; i += 3)
          setTimeout(() => { if (Sound) Sound.play("lay"); }, i * INTRO_STEP);
        setTimeout(() => { b.classList.remove("dealing"); done(); }, dealFor);
        /* The case is flat well before its animation ends — the last of it is
           the settle. So the checkers start coming out then, and the two run
           into each other instead of waiting politely in turn. */
      }, withCase ? INTRO_FOLD - 260 : 0);
    });
  }

  /* ---------------- rounds and the match ---------------- */
  function finish() {
    const won = g.roundWinner === ME;
    const what = g.roundWorth >= 3 ? "კოკა" : g.roundWorth === 2 ? "მარსი" : "";
    if (g.phase === "over") {
      showResult(g.matchWinner === ME ? "მოიგე!" : "წააგე",
        "ანგარიში " + g.scores[ME] + " : " + g.scores[CPU]);
      if (g.matchWinner === ME && window.Fx) Fx.confetti();
      return;
    }
    showResult(won ? "პარტია შენია" : "პარტია კომპიუტერს",
      (what ? what + " — " : "") + "+" + g.roundWorth +
      " · ანგარიში " + g.scores[ME] + " : " + g.scores[CPU]);
    setTimeout(async () => {
      hide();
      Nardi.nextRound(g);
      draw();
      busy = true; draw();
      await intro(false);
      busy = false; draw();
      if (g.side === CPU) setTimeout(cpuTurn, 500);
    }, 2200);
  }

  function showResult(title, text) {
    document.getElementById("resTitle").textContent = title;
    document.getElementById("resText").textContent = text || "";
    document.getElementById("resultOverlay").classList.add("show");
  }
  const hide = () => document.getElementById("resultOverlay").classList.remove("show");
  const say = (t) => { document.getElementById("msg").textContent = t; };

  async function startMatch() {
    hide();
    g = Nardi.newGame({ variant: VARIANT, target: TARGET });
    picked = null;
    busy = true;                    // the board is not yours until it is open
    say("");                 // the bar is for what happens, not for the title
    build(); fit(); clearDice(false); draw();
    await intro(true);
    busy = false; draw();
    if (g.side === CPU) setTimeout(cpuTurn, 600);
  }

  /* =====================================================================
     Playing somebody.

     The server holds the game and checks every move; what arrives here is the
     whole board, because a board has nothing to hide. It is written into a
     local engine of the same file the server runs, and from that point on the
     screen cannot tell the difference: `legalMoves` lights the same points,
     `targetsFrom` offers the same moves, and a move it would refuse the server
     would refuse too.
     ===================================================================== */
  function applyState(st) {
    if (st.seat != null && st.seat !== ME) { ME = st.seat; CPU = 1 - ME; build(); fit(); }
    seated = true;
    if (!g) g = Nardi.newGame({ variant: st.variant || VARIANT, target: st.target || TARGET });
    if (st.pts) {
      g.pts = st.pts.slice(); g.bar = st.bar.slice(); g.off = st.off.slice();
      g.side = st.side; g.dice = st.dice ? st.dice.slice() : null;
      g.left = st.left ? st.left.slice() : [];
      g.phase = st.nphase; g.scores = st.scores ? st.scores.slice() : g.scores;
      g.round = st.round || g.round; g.target = st.target || g.target;
    }
    undoLeft = st.undo || 0;
    mayDouble = !!st.mayDouble;
    opp = { name: st.oppName || "", pic: st.oppPic || null,
            level: st.oppLevel != null ? st.oppLevel : null, bot: !!st.oppBot };
    mine = { name: mine.name, pic: st.myPic || null,
             level: st.myLevel != null ? st.myLevel : null,
             coins: st.myCoins != null ? st.myCoins : null };
    stakeMul = st.stakeMul || 1;
    /* The question only stops the player it is put to. The one who asked sees
       the same window without the buttons, so they know why nothing is
       happening. */
    const offer = st.offer;
    const cube = document.getElementById("cubeOverlay");
    if (offer) {
      const mine = offer.to === ME;
      document.getElementById("cubeText").textContent = mine
        ? "მოწინააღმდეგე ×" + offer.value + " ფსონს გთავაზობს. თუ არ დათანხმდი, მატჩს კარგავ."
        : "შეთავაზება გაგზავნილია — ×" + offer.value + ". ველოდებით პასუხს.";
      document.getElementById("cubeAsk").style.display = mine ? "" : "none";
    }
    show(cube, !!offer);
    const playing = st.pts && (st.phase === "play" || st.phase === "roundEnd" || st.phase === "over");
    show(document.getElementById("waitOverlay"), !playing);
    busy = !!st.paused || st.phase === "roundEnd";
    say(st.paused ? "ველოდებით — " + (st.waitingFor || []).join(", ") : (st.log || ""));
    draw();
    /* after draw, not before: the offline half of `draw` writes this line too,
       and online it is the other PLAYER whose name belongs there */
    document.getElementById("turnName").textContent =
      st.phase === "over" ? "მატჩი დასრულდა"
      : st.paused ? "შეჩერებულია"
      : st.side === ME ? (st.nphase === "roll" ? "შენი გაგორებაა" : "შენი სვლა")
      : (st.oppName || "მოწინააღმდეგე");
    // the dice are thrown when the server says there are new ones
    const key = st.dice ? st.dice.join(",") + ":" + st.round + ":" + st.side : null;
    if (key && key !== lastDice) {
      lastDice = key;
      shownValues = st.dice.slice();
      throwDice(shownValues, st.side === ME);
    } else if (!st.dice) { lastDice = null; clearDice(true); }
  }
  const show = (el, on) => el.classList.toggle("show", !!on);

  function leaveTable() {
    const go = () => { if (socket) socket.emit("leaveRoom"); location.href = "index.html"; };
    if (!seated || !g) { go(); return; }
    Leaving.confirmLeave(go);
  }

  function startOnline() {
    socket = io(window.SERVER_URL || undefined, { transports: ["websocket", "polling"] });
    const who = Auth && Auth.me ? Auth.me() : null;
    const join = () => {
      const p = { game: "nardi", variant: VARIANT, target: TARGET, size: 2,
                  name: (Auth && Auth.name && Auth.name()) || "მოთამაშე",
                  token: TOKEN, auth: who };
      if (MODE === "quick") socket.emit("quickJoin", p);
      else if (MODE === "friend") socket.emit("createTable", p);
      else if (MODE === "join") socket.emit("joinTable", Object.assign({ code: (P.get("code") || "").toUpperCase() }, p));
      else socket.emit("resume", { token: TOKEN, game: "nardi" });
    };
    socket.on("connect", () => { if (seated) socket.emit("resume", { token: TOKEN, game: "nardi" }); else join(); });
    socket.on("state", (st) => {
      if (st.code) {
        document.getElementById("codeBox").style.display = "";
        document.getElementById("codeVal").textContent = st.code;
        document.getElementById("waitText").textContent = "გაუზიარე ეს კოდი მეგობარს";
      }
      applyState(st);
    });
    socket.on("matchOver", (m) => {
      busy = true; draw();
      showResult(m.youWon ? "მოიგე!" : "წააგე",
        m.scores ? "ანგარიში " + m.scores[ME] + " : " + m.scores[CPU] : "");
      if (m.youWon && window.Fx) Fx.confetti();
      if (Sound) Sound.play(m.youWon ? "win" : "lose");
    });
    socket.on("opponentLeft", (m) => { say((m && m.name ? m.name : "მოწინააღმდეგე") + " გავიდა"); });
    socket.on("joinError", (m) => {
      document.getElementById("waitTitle").textContent = "ვერ შევედი";
      document.getElementById("waitText").textContent = m || "";
    });
    socket.on("resumeFailed", () => { location.replace("index.html"); });
    socket.on("atTable", (t) => { if (t) location.replace("index.html"); });
    socket.on("disconnect", () => say("კავშირი გაწყდა…"));
    // the case still opens, and the board is set out, before the first roll
    build(); fit();
    document.getElementById("waitOverlay").classList.add("show");
  }

  function toggleSound() {
    /* A class, not a glyph: the icon is drawn in CSS and there are no emoji on
       these screens. `Sound.toggle` hands back whether it is now MUTED — the
       old line read it as the opposite and drew the icon the wrong way round. */
    const isMuted = Sound.toggle();
    document.getElementById("sndBtn").classList.toggle("muted", isMuted);
  }

  /* Leaving a table you are sitting at is a question, not a button — the same
     one every other screen asks. */
  document.querySelector(".stage .top .back").onclick = () =>
    ONLINE ? leaveTable() : (location.href = "index.html");
  document.querySelector(".boardWrap").addEventListener("click", tapBoard);
  document.getElementById("btnMain").onclick = mainAction;
  document.getElementById("btnAlt").onclick = altAction;
  {
    const b = document.getElementById("board");
    b.addEventListener("pointerdown", onDown);
    b.addEventListener("pointermove", onMove);
    b.addEventListener("pointerup", onUp);
    b.addEventListener("pointercancel", onUp);
  }
  document.getElementById("sndBtn").classList.toggle("muted", Sound.muted());
  addEventListener("resize", () => { fit(); draw(); });
  /* The first measurement is taken before the fonts have landed and before the
     browser has decided how much of the screen it is keeping for itself, so it
     is usually wrong by a little and sometimes wrong by a lot. Watching the box
     is more honest than guessing when it has settled. */
  /* Kept in a variable on purpose: an observer nobody holds a reference to can
     be collected, and then the board silently stops following its box. */
  let boardWatch = null;
  if (window.ResizeObserver) {
    boardWatch = new ResizeObserver(() => fit());
    boardWatch.observe(document.querySelector(".boardWrap"));
  }
  if (ONLINE) startOnline(); else startMatch();
  </script>
</body>
</html>
