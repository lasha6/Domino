<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ჯოკერი — კომპიუტერთან</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f5230" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/cards.css" />
  <script src="js/progress.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/fullscreen.js"></script>
</head>
<body>
  <div class="stage">
    <div class="top">
      <button class="back" onclick="location.href='index.html'">←</button>
      <button class="histBtn" id="histBtn" onclick="toggleHist()">📋 ისტორია <span class="chev">▾</span></button>
      <div class="jkScores" id="scores"></div>   <!-- your own running total only -->
      <div class="info">
        <span class="stat"><span class="k">სეტი</span><b id="setNo">1</b></span>
        <span class="stat"><span class="k">ხელი</span><b id="handNo">1/24</b></span>
        <span class="stat"><span class="k">კოზირი</span><b id="trumpLbl">—</b></span>
        <span class="stat"><span class="k">ბიდი</span><b id="myBid">—</b></span>
        <span class="badge">🎓 პრაქტიკა</span>
      </div>
      <div class="spacer" style="flex:0 1 8px"></div>
      <button class="back sndBtn" id="sndBtn" onclick="toggleSound()" title="ხმა">🔊</button>
      <button class="newgame" onclick="startMatch()">ახალი თამაში</button>
    </div>

    <div class="statusrow">
      <div class="msg" id="msg"></div>
    </div>

    <div class="btable four jk" id="btable">
      <!-- the whole match so far, pulled down over the table -->
      <div class="histPanel" id="histPanel"><div class="histInner" id="histInner"></div></div>
      <div class="seatBox left jk"   id="seatLeft"></div>
      <div class="seatBox across jk" id="seatAcross"></div>
      <div class="seatBox right jk"  id="seatRight"></div>
      <div class="stock">
        <div class="trumpBox" id="trumpBox"></div>
      </div>
      <!-- Your own marker sits ON the line at the foot of the table, beside the
           words, because that is where you are already looking while you read
           your cards. It is a child of the label rather than something measured
           against it: the table changes height as the hand goes on, and a
           measured position was landing where the label used to be. -->
      <div class="pileLbl" id="pileLbl">
        <span class="tchip" id="chipMe"></span><span id="pileTxt">მაგიდა</span>
      </div>
      <!-- the other three are laid on the felt beside their plates -->
      <div class="tchip" id="chipLeft"></div>
      <div class="tchip" id="chipAcross"></div>
      <div class="tchip" id="chipRight"></div>
      <div class="trick cross" id="trick"></div>
    </div>

    <div class="bbar" id="bar"></div>
    <div class="bhand jkHand" id="myhand"></div>
  </div>

  <!-- the end of a hand: what everyone said, took and scored -->
  <div class="overlay" id="handOverlay">
    <div class="modal">
      <h2 id="handTitle">ხელი დასრულდა</h2>
      <div id="handBody"></div>
      <button id="handBtn">შემდეგი ხელი ▶</button>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="modal">
      <h2 id="resultTitle"></h2>
      <div id="resultBody"></div>
      <button id="resultBtn">ახალი თამაში</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="rotate">
    <div class="phone">📱</div>
    <h2 style="color:var(--brass-lit)">გადააბრუნე მოწყობილობა</h2>
    <p>თამაში თარაზულ (landscape) რეჟიმში ითამაშება.</p>
  </div>

  <script src="js/joker.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script>
    /* ჯოკერი against three computers. Practice only — no coins change hands
       here, exactly as with the other two screens, so the machine cannot be
       farmed for them.

       Four seats: you are always seat 0 at the bottom, and the other three sit
       round the table clockwise — left, across, right — the same seating the
       ბურა table uses, so a player only learns it once. */
    const ME = 0;
    const NAMES = ["შენ", "გიორგი", "ნინო", "დათო"];
    const REL = ["me", "left", "across", "right"];

    let g = null, busy = false, pending = null;   // pending = a joker awaiting its answer

    /* How fast the computers move. Unhurried on purpose: with four hands going
       into a trick there is a lot to read before it is swept away. */
    const PACE = { bid: 800, think: 950, showTrick: 2100, betweenHands: 400 };

    function paintSoundBtn(){ document.getElementById("sndBtn").textContent = Sound.muted() ? "🔇" : "🔊"; }
    function toggleSound(){ Sound.toggle(); paintSoundBtn(); if(!Sound.muted()) Sound.play("tap"); }
    paintSoundBtn();

    let toastTimer = null;
    function toast(m){
      const t = document.getElementById("toast");
      t.textContent = m; t.classList.add("show");
      clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
    }
    function setMsg(m){ document.getElementById("msg").textContent = m || ""; }

    /* ---------------- drawing a card ----------------
       The joker has no suit to print, so it gets the face the card is named
       after: a laughing jester in a three-pointed cap with a bell on each
       outer point. The shape is the plainest of the classic ones, because this
       card gets dealt at 36px on a narrow table and the detailed jesters are
       lovely at full size and mush at that one.

       The cap is red and BLUE, not red and black. Black and red are the two
       suit colours in this deck, and at 36px a joker in them reads as "some red
       card". No suit is blue, so it cannot be mistaken for one.

       Drawn rather than fetched, like every other card here, so it stays sharp
       at any size and the app carries no picture files. Every curve in it was
       rendered and looked at rather than guessed. */
    const JESTER =
      '<svg class="jkArt" viewBox="0 0 100 132" aria-hidden="true">'
      // the face first, so the cap can be laid over its forehead
      + '<path class="face" d="M22 56 C21 80 27 102 39 113 C45 118 55 118 61 113 C73 102 79 80 78 56 Z"/>'
      // the two outer points, then the tall middle one, split down the centre
      + '<path class="capR" d="M24 68 C17 56 12 44 11 33 C22 40 30 52 37 66 Z"/>'
      + '<path class="capB" d="M76 68 C83 56 88 44 89 33 C78 40 70 52 63 66 Z"/>'
      + '<path class="capR" d="M50 4 C45 24 40 46 39 66 L50 68 Z"/>'
      + '<path class="capB" d="M50 4 C55 24 60 46 61 66 L50 68 Z"/>'
      // the band across the brow that ties the three together
      + '<path class="capR" d="M50 51 C34 51 24 55 18 62 C28 69 38 71 50 71 Z"/>'
      + '<path class="capB" d="M50 51 C66 51 76 55 82 62 C72 69 62 71 50 71 Z"/>'
      + '<circle class="bell" cx="10" cy="31" r="6.4"/>'
      + '<circle class="bell" cx="90" cy="31" r="6.4"/>'
      // laughing eyes and a wide grin
      + '<path class="ink" d="M28 78 C33 70 42 73 47 83 C41 78 33 76 28 78 Z"/>'
      + '<path class="ink" d="M72 78 C67 70 58 73 53 83 C59 78 67 76 72 78 Z"/>'
      + '<path class="ink" d="M33 94 C40 109 60 109 67 94 C59 100 41 100 33 94 Z"/>'
      + '</svg>';

    const RED = [1, 2];                       // hearts and diamonds
    function cardEl(card, opts){
      const o = opts || {};
      const d = document.createElement("div");
      if (Joker.isJoker(card)) {
        d.className = "card jokerCard" + (o.small ? " small" : "") + (o.dim ? " dim" : "");
        d.innerHTML = '<span class="rank">ჯოკ</span>' + JESTER;
        return d;
      }
      d.className = "card " + (RED.includes(card[0]) ? "red" : "black")
                  + (o.small ? " small" : "") + (o.dim ? " dim" : "");
      const suit = Joker.SUITS[card[0]];
      d.innerHTML = '<span class="rank">' + Joker.RANKS[card[1]] + '</span>'
                  + '<span class="pip">' + suit + '</span>'
                  + '<span class="big">' + suit + '</span>';
      return d;
    }
    function backEl(small){
      const d = document.createElement("div");
      d.className = "card back" + (small ? " small" : "");
      return d;
    }
    function suitEl(suit, small){
      const d = document.createElement("div");
      d.className = "card suitOnly " + (RED.includes(suit) ? "red" : "black") + (small ? " small" : "");
      d.innerHTML = '<span class="pip">' + Joker.SUITS[suit] + '</span>';
      return d;
    }

    /* ---------------- how big everything is drawn ----------------
       Measured from the screen rather than fixed, and measured again whenever
       it changes: a phone in landscape, a tablet and a browser window dragged
       narrow are three different tables and one set of pixel sizes cannot suit
       all three.

       The table is given its share FIRST and the hand takes what is left. The
       other way round — which is what a plain flex layout does — left the table
       76px tall with 22px cards on it while the hand below held 48px ones. The
       trick is the thing being looked at; it does not come second. */
    const RATIO = 1.5;              // a card is half again as tall as it is wide
    function fitTable(){
      const stage = document.querySelector(".stage");
      const bt = document.getElementById("btable");
      const hand = document.getElementById("myhand");
      const h = (s) => { const e = document.querySelector(s);
                         return e ? e.getBoundingClientRect().height : 0; };
      const sr = stage.getBoundingClientRect();
      if (!sr.height) return;

      const free = sr.height - h(".top") - h(".statusrow") - h(".bbar") - 10;
      if (free < 80) return;
      const handH = Math.round(Math.max(50, Math.min(96, free * 0.32)));
      const tableH = Math.max(90, free - handH);
      hand.style.height = handH + "px";
      hand.style.minHeight = "0";
      bt.style.height = tableH + "px";
      bt.style.flex = "0 0 auto";

      // the partner sits across the top; the cross gets what is under them
      const across = document.getElementById("seatAcross").getBoundingClientRect().height || 20;
      const padTop = Math.round(across + 12);
      bt.style.paddingTop = padTop + "px";
      /* And room at the foot for the line that names the trick. It has to be
         PADDING, not arithmetic: the cross is centred in the table, and a box
         that has not been made shorter centres the cross straight through the
         words. A chip stands taller than the words it sits beside, so the room
         kept is the room a chip needs. */
      const padBottom = 44;
      bt.style.paddingBottom = padBottom + "px";

      const r = bt.getBoundingClientRect();
      const availH = tableH - padTop - padBottom - 4;         // 18 for the label at the foot
      // the two side seats keep the edges; the cross gets between them
      const side = Math.min(150, Math.max(70, r.width * 0.18));
      const availW = Math.max(90, r.width - side * 2);
      /* the cross is a card plus two offsets each way: 2.16 cards tall and
         3.1 cards wide, which is what the stylesheet builds from --jkDx/--jkDy */
      let w = Math.min(availW / 2.9, availH / 2.04 / RATIO);
      w = Math.max(20, Math.min(78, Math.floor(w)));
      bt.style.setProperty("--jkW", w + "px");
      bt.style.setProperty("--jkH", Math.round(w * RATIO) + "px");
      bt.style.setProperty("--jkDx", Math.round(w * 0.95) + "px");
      bt.style.setProperty("--jkDy", Math.round(w * RATIO * 0.52) + "px");

      /* And your own hand, which has to fit however many cards are in it — nine
         at the widest — inside the height it was just given. */
      const n = Math.max(1, (g && g.hands[ME].length) || 1);
      const gap = 8;
      const byWidth = Math.floor((r.width - gap * (n + 1)) / n);
      const byHeight = Math.floor((handH - 8) / RATIO);
      const hw = Math.max(22, Math.min(72, byWidth, byHeight));
      hand.style.setProperty("--jkHandW", hw + "px");
    }
    addEventListener("resize", () => { fitTable(); });

    /* ---------------- who is first and who is last ----------------
       Two markers, a green one and a red one, laid on the table beside the
       players they belong to: green where the play starts, red where it ends.

       It is the same pair of seats in both halves of a hand, which is why one
       pair of markers does for both. While the bidding goes round, green is on
       the player who calls first and red on the dealer, who calls last and may
       not make the numbers add up. While the tricks are played, green is on
       whoever leads and red on the seat that answers last — the one who plays
       knowing what everybody else has put down. */
    function firstSeat(){
      if (!g || g.phase === "handOver" || g.phase === "over") return null;
      if (g.phase === "play" && g.trick.length) return g.trick[0].seat;
      if (g.phase === "play") return g.turn;
      return Joker.leftOfDealer(g);            // bidding, and choosing the trump
    }
    const lastSeat = () => { const f = firstSeat(); return f == null ? null : (f + 3) % 4; };
    /* A chip is a chip: a round counter with a rim, laid on the cloth beside
       its player, not a dot pinned to their name plate. */
    function chipKind(seat){
      if (seat == null) return null;
      if (seat === firstSeat()) return "first";
      if (seat === lastSeat())  return "last";
      return null;
    }
    const CHIP_IDS = { 0: "chipMe", 1: "chipLeft", 2: "chipAcross", 3: "chipRight" };
    function paintChips(){
      for (let i = 0; i < 4; i++) {
        const seat = (ME + i) % 4;
        const el = document.getElementById(CHIP_IDS[i]);
        const kind = chipKind(seat);
        el.className = "tchip" + (kind ? " show " + kind : "");
        el.title = kind === "first" ? "პირველი ჩამომსვლელი"
                 : kind === "last"  ? "ბოლო ჩამომსვლელი" : "";
      }
      placeChips();
    }
    /* The three plates are different widths — a name can be long — so where the
       chip sits beside each one is measured rather than guessed. Yours needs no
       measuring: it goes on the cloth in front of you. */
    function placeChips(){
      const bt = document.getElementById("btable").getBoundingClientRect();
      if (!bt.width) return;
      const put = (chipId, plateId, side) => {
        const c = document.getElementById(chipId);
        const p = document.getElementById(plateId).getBoundingClientRect();
        const w = c.offsetWidth || 20;
        c.style.top = Math.round(p.top - bt.top + (p.height - w) / 2) + "px";
        c.style.left = side > 0 ? Math.round(p.right - bt.left + 8) + "px"
                                : Math.round(p.left - bt.left - w - 8) + "px";
      };
      put("chipLeft",  "seatLeft",  +1);
      put("chipRight", "seatRight", -1);
      put("chipAcross","seatAcross", +1);
      /* Yours goes beside the words at the foot of the table. It used to sit in
         the right-hand corner, and the player made the point: while you are
         looking at your cards you are not going to glance all the way over
         there. The middle of the bottom edge is where your eyes already are —
         and beside the label rather than under the cross, which is what drove
         it into the corner in the first place. */
    }

    /* ---------------- the record of the match ----------------
       Everything that has happened, hand by hand: what each player said and
       what it earned them. It comes down over the table rather than sitting
       beside it, because the table is the one thing on this screen with no
       room to spare.

       A bid of nothing is written "–" rather than "0". On paper that is how a
       pass is put down, and in a column of figures a nought reads as a score
       rather than as a call. It changes nothing but the writing. */
    const PASS = "–";
    let histOpen = false;
    function toggleHist(){
      histOpen = !histOpen;
      document.getElementById("histPanel").classList.toggle("show", histOpen);
      document.getElementById("histBtn").classList.toggle("on", histOpen);
      Sound.play("tap");
      if (histOpen) {
        paintHist();
        const box = document.getElementById("histInner");
        box.scrollTop = box.scrollHeight;      // opens showing the latest
      }
    }
    function paintHist(){
      const box = document.getElementById("histInner");
      /* Stay at the newest hand as they are added, unless the reader has
         scrolled back to look at an earlier one — then leave them where they
         are until they come back down. */
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 6;
      box.innerHTML = "";
      if (!g.history.length) {
        const p = document.createElement("p");
        p.className = "histEmpty";
        p.textContent = "ჯერ არცერთი ხელი არ დასრულებულა";
        box.appendChild(p);
        return;
      }
      const t = document.createElement("table");
      t.className = "histTable";

      const head = document.createElement("tr");
      const corner = document.createElement("th"); corner.textContent = "#";
      head.appendChild(corner);
      NAMES.forEach((n, p) => {
        const th = document.createElement("th");
        if (p === ME) th.className = "me";
        th.colSpan = 2; th.textContent = n;
        head.appendChild(th);
      });
      t.appendChild(head);

      const cell = (tr, cls, text) => {
        const td = document.createElement("td");
        td.className = cls; td.textContent = text;
        tr.appendChild(td); return td;
      };

      /* The record is kept the way the game is played: the eight hands of the
         first set, then what the set came to, then the four nines, and so on.
         The left-hand column is how many cards were dealt, not which hand it
         was — 1 2 3 4 5 6 7 8, 9 9 9 9, 8 7 6 5 4 3 2 1, 9 9 9 9 is the shape
         of the whole game and a player reads their place in it at a glance. */
      const setTotal = (set, sum) => {
        const tr = document.createElement("tr");
        tr.className = "setSum";
        cell(tr, "no", "ჯამი");
        const bonus = g.bonuses ? g.bonuses[set] : null;
        for (let p = 0; p < 4; p++) {
          const extra = bonus ? bonus[p] : 0;
          const b = cell(tr, "bid" + (p === ME ? " me" : ""), extra ? "+" + extra : "");
          if (extra) b.classList.add("bonus");
          cell(tr, "pts" + (p === ME ? " me" : "") + (sum[p] + extra < 0 ? " bad" : ""),
               sum[p] + extra);
        }
        t.appendChild(tr);
      };

      let set = null, sum = [0, 0, 0, 0], inSet = 0;
      g.history.forEach((h) => {
        if (set !== null && h.set !== set) { setTotal(set, sum); sum = [0, 0, 0, 0]; inSet = 0; }
        set = h.set; inSet++;
        const tr = document.createElement("tr");
        const no = cell(tr, "no", h.size);
        no.title = "სეტი " + h.set;
        for (let p = 0; p < 4; p++) {
          sum[p] += h.points[p];
          cell(tr, "bid" + (p === ME ? " me" : ""), h.bids[p] === 0 ? PASS : h.bids[p]);
          cell(tr, "pts" + (p === ME ? " me" : "")
                 + (h.points[p] < 0 ? " bad" : h.bids[p] === h.took[p] ? " good" : ""),
               h.points[p]);
        }
        t.appendChild(tr);
      });
      // the set in progress gets no total until it is finished
      if (set !== null && inSet === Joker.SET_SIZES[set - 1].length) setTotal(set, sum);

      const foot = document.createElement("tr");
      foot.className = "total";
      cell(foot, "no", "სულ");
      for (let p = 0; p < 4; p++) {
        cell(foot, "bid", "");
        cell(foot, "pts" + (p === ME ? " me" : "") + (g.scores[p] < 0 ? " bad" : ""), g.scores[p]);
      }
      t.appendChild(foot);
      box.appendChild(t);
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    /* ---------------- the whole screen ---------------- */
    function render(){
      if (!g) return;
      fitTable();
      const s = Joker.spec(g);
      document.getElementById("setNo").textContent = s.set;
      document.getElementById("handNo").textContent = (g.hand + 1) + "/" + Joker.HANDS
                                                    + " · " + s.size;
      document.getElementById("trumpLbl").textContent =
        g.phase === "choose" ? "—"
        : g.trump === Joker.NOTRUMP ? "ბეზი" : Joker.SUITS[g.trump];
      document.getElementById("myBid").textContent =
        g.bids[ME] == null ? "—" : g.bids[ME] + " / " + g.took[ME];

      paintScores();
      paintTrump();
      paintSeats();
      paintChips();
      paintTrick();
      paintHand();
      paintBar();
      if (histOpen) paintHist();
      placeChips();
    }

    /* Only your own total goes up here. The other three carry theirs at their
       own seat, which is where a player looks for them anyway — and four names
       plus four figures plus two buttons did not fit a phone in landscape, so
       the names were being cut to "გიო…". */
    function paintScores(){
      const box = document.getElementById("scores");
      box.innerHTML = "";
      const d = document.createElement("div");
      d.className = "who me" + (g.turn === ME && g.phase !== "handOver" ? " turn" : "");
      const nm = document.createElement("span"); nm.textContent = NAMES[ME];
      const sc = document.createElement("b"); sc.textContent = g.scores[ME];
      d.appendChild(nm); d.appendChild(sc);
      box.appendChild(d);
    }

    /* The trump.

       In the hands of one to eight a card is turned, and that CARD is what goes
       on the table — never a word for it. The player put it plainly: whatever is
       turned there is not in anybody hand. So when the turned card is a joker,
       the joker is drawn: the table is telling everyone that only one joker is
       still in play, and that is worth knowing. The trump is ბეზი in that case,
       which the bar at the top says.

       Only the nines have nothing to turn — four nines is the whole deck. There
       the chooser names it, so there is a suit to show, or the word ბეზი, and
       nothing else to draw. */
    function paintTrump(){
      const tb = document.getElementById("trumpBox");
      tb.innerHTML = "";
      if (g.phase === "choose") return;
      let t;
      if (g.turned) t = cardEl(g.turned, { small: true });          // the card itself
      else if (g.trump === Joker.NOTRUMP) {
        t = document.createElement("div");
        t.className = "bezCard"; t.textContent = "ბეზი";
      } else t = suitEl(g.trump, true);
      t.classList.add("turned");
      tb.appendChild(t);
    }

    function tallyText(p){
      if (g.bids[p] == null) return "—";
      return g.bids[p] + " / " + g.took[p];
    }
    function paintSeats(){
      for (let i = 1; i < 4; i++) {
        const seat = (ME + i) % 4;
        const rel = REL[i];
        const box = document.getElementById("seat" + rel[0].toUpperCase() + rel.slice(1));
        box.innerHTML = "";
        box.classList.toggle("turn", g.turn === seat && g.phase !== "handOver" && g.phase !== "over");

        const who = document.createElement("div");
        who.className = "who";
        who.textContent = NAMES[seat] + (g.dealer === seat ? " 🃏" : "");
        const tally = document.createElement("div");
        tally.className = "tally";
        tally.textContent = tallyText(seat);
        const score = document.createElement("div");
        score.className = "seatScore";
        score.textContent = g.scores[seat];

        if (g.bids[seat] != null) {
          if (g.took[seat] === g.bids[seat]) tally.classList.add("done");
          else if (g.took[seat] > g.bids[seat]) tally.classList.add("blown");
        }
        const fan = document.createElement("div");
        fan.className = "fan";
        for (let k = 0; k < g.hands[seat].length; k++) fan.appendChild(backEl(true));

        if (rel === "across") { box.appendChild(who); box.appendChild(tally); box.appendChild(score); box.appendChild(fan); }
        else { box.appendChild(fan); box.appendChild(score); box.appendChild(tally); box.appendChild(who); }
      }
    }

    /* The trick, laid out as a cross: each card at the side of the table its
       player sits on. Everybody puts down exactly one card in this game, so a
       pile would only hide them behind each other — laid out this way nobody
       has to be told whose card is whose.

       Later cards sit on top of earlier ones, the way they land on a table. */
    function paintTrick(){
      const box = document.getElementById("trick");
      const lbl = document.getElementById("pileTxt");
      box.innerHTML = "";
      const show = g.trick.length ? g.trick
                 : (g.lastTrick && !trickCleared ? g.lastTrick.cards : []);
      const winner = g.trick.length ? null : (g.lastTrick && !trickCleared ? g.lastTrick.winner : null);

      show.forEach((p, i) => {
        const d = document.createElement("div");
        d.className = "trickRow " + (i === 0 ? "led" : "answer") + (winner === p.seat ? " took" : "");
        const card = cardEl(p.card, { small: true });
        if (Joker.isJoker(p.card)) card.title = p.high ? "მაღლა" : "დაბლა";
        d.appendChild(card);
        d.classList.add("at-" + REL[(p.seat - ME + 4) % 4]);
        d.style.zIndex = String(2 + i);
        box.appendChild(d);
      });

      if (g.phase === "choose")      lbl.textContent = "კოზირი ცხადდება";
      else if (g.phase === "bid")    lbl.textContent = "ბიდი";
      else if (g.trick.length && Joker.isJoker(g.trick[0].card))
        lbl.textContent = (g.trick[0].high ? "მაღალი — " : "წაიღოს — ") + Joker.SUITS[g.ledSuit];
      else if (g.trick.length)       lbl.textContent = "მაგიდა";
      else if (winner != null)       lbl.textContent = "ხელი აიღო — " + NAMES[winner];
      else                           lbl.textContent = "მაგიდა";
    }

    function paintHand(){
      const mh = document.getElementById("myhand");
      mh.innerHTML = "";
      const legal = (g.phase === "play" && g.turn === ME && !pending)
        ? Joker.legalPlays(g, ME) : null;
      g.hands[ME].forEach((card) => {
        const ok = !legal || legal.some((c) => Joker.sameCard(c, card));
        const el = cardEl(card, { dim: legal && !ok });
        if (legal && ok) el.onclick = () => pickCard(card);
        mh.appendChild(el);
      });
    }

    /* The row under the table asks whatever the game is waiting for: a trump,
       a bid, or the two questions a joker comes with. */
    function paintBar(){
      const bar = document.getElementById("bar");
      bar.innerHTML = "";
      /* An empty row still takes forty pixels, and while a hand is being played
         there is nothing to ask — so it goes away and the table gets the room.
         Whatever it would have said lives in the strip along the top. */
      /* Hiding the row changes the height of the table, so everything measured
         against it has to be measured again — the chips were being placed
         against the layout as it stood a moment earlier. */
      setTimeout(() => {
        bar.style.display = bar.children.length ? "" : "none";
        fitTable();
        placeChips();
      }, 0);
      const add = (label, fn, cls, off) => {
        const b = document.createElement("button");
        b.className = "bbtn" + (cls ? " " + cls : "");
        b.textContent = label; b.disabled = !!off; b.onclick = fn;
        bar.appendChild(b);
        return b;
      };

      if (g.phase === "choose" && g.turn === ME) {
        setMsg("სამი კარტი გიჭირავს — დაასახელე კოზირი ან ბეზი");
        Joker.SUITS.forEach((sym, i) => add(sym, () => chooseTrump(i), "suit" + (RED.includes(i) ? " red" : "")));
        add("ბეზი", () => chooseTrump(Joker.NOTRUMP), "ghost");
        return;
      }
      if (g.phase === "bid" && g.turn === ME) {
        const size = Joker.spec(g).size;
        const no = Joker.forbiddenBid(g, ME);
        setMsg(no != null ? "შენ ხარ დილერი — " + no + " აკრძალულია" : "რამდენ ხელს აიღებ?");
        for (let n = 0; n <= size; n++) add(String(n), () => makeBid(n), "num", n === no);
        return;
      }
      /* What you are declaring comes first and the suit second, and each of the
         two is the single word a player says at the table: მაღალი, or წაიღოს.
         Naming the suit before saying which call it is put the choice the wrong
         way round — the suit means nothing until the call is made. */
      if (pending && pending.need === "takes") {
        setMsg("ჯოკერით შედიხარ — რას აცხადებ?");
        add("მაღალი", () => askSuit(true), "hi");
        add("წაიღოს", () => askSuit(false), "give");
        add("გაუქმება", cancelJoker, "ghost");
        return;
      }
      if (pending && pending.need === "suit") {
        setMsg(pending.high ? "მაღალი — რომელი ფერი?" : "წაიღოს — რომელი ფერი?");
        Joker.SUITS.forEach((sym, i) =>
          add(sym, () => finishJoker({ suit: i, high: pending.high }),
              "suit" + (RED.includes(i) ? " red" : "")));
        add("გაუქმება", cancelJoker, "ghost");
        return;
      }
      if (pending && pending.need === "high") {
        setMsg("ჯოკერი — მაღლა თუ დაბლა?");
        add("მაღლა ↑", () => finishJoker({ high: true }));
        add("დაბლა ↓", () => finishJoker({ high: false }), "ghost");
        add("გაუქმება", cancelJoker, "ghost");
        return;
      }
      if (g.phase === "play") {
        setMsg(g.turn === ME ? "შენი სვლა" : NAMES[g.turn] + " ფიქრობს");
        return;                       // nothing to ask, so the row goes away
      }
      if (g.phase === "bid") setMsg(NAMES[g.turn] + " ბიდავს");
    }

    /* ---------------- your moves ---------------- */
    function chooseTrump(t){
      if (!Joker.chooseTrump(g, ME, t)) return;
      Sound.play("tap");
      render();
      step();
    }
    function makeBid(n){
      if (!Joker.bid(g, ME, n)) return;
      Sound.play("tap");
      render();
      step();
    }
    /* A joker is two decisions, not one. Leading with it asks for a suit and is
       always high — the player was clear that "low" is not something you can
       declare on the way in. Played onto somebody else's trick it asks the
       other question instead: take it, or throw it away. */
    function pickCard(card){
      if (busy || g.phase !== "play" || g.turn !== ME) return;
      if (Joker.isJoker(card)) {
        pending = { card, need: g.trick.length ? "high" : "takes" };
        Sound.play("tap");
        render();
        return;
      }
      playMine(card, {});
    }
    function askSuit(high){
      pending = { card: pending.card, need: "suit", high };
      Sound.play("tap");
      render();
    }
    function finishJoker(opts){
      const card = pending.card;
      pending = null;
      playMine(card, opts);
    }
    function cancelJoker(){ pending = null; render(); }

    function playMine(card, opts){
      if (!Joker.play(g, ME, card, opts)) { toast("ასე არ შეიძლება"); render(); return; }
      Sound.play("card");
      render();
      step();
    }

    /* ---------------- the computers, and the run of the hand ---------------- */
    let trickCleared = true, trickTimer = null;

    function step(){
      if (!g || busy) return;
      if (g.phase === "handOver") { showHand(); return; }
      if (g.phase === "over")     { showResult(); return; }

      // a finished trick stays on the table for a moment before it is swept
      if (!g.trick.length && g.lastTrick && !trickCleared) {
        busy = true;
        clearTimeout(trickTimer);
        trickTimer = setTimeout(() => {
          trickCleared = true; busy = false; render(); step();
        }, PACE.showTrick);
        return;
      }

      if (g.turn === ME) { render(); return; }        // your move now

      busy = true;
      const seat = g.turn;
      const wait = g.phase === "bid" ? PACE.bid : PACE.think;
      setTimeout(() => {
        busy = false;
        if (!g) return;
        if (g.phase === "choose") { Joker.chooseTrump(g, seat, botTrump(seat)); }
        else if (g.phase === "bid") { Joker.bid(g, seat, Joker.aiBid(g, seat)); }
        else if (g.phase === "play") {
          const before = g.trick.length;
          const m = Joker.aiPlay(g, seat);
          Joker.play(g, seat, m.card, m.opts);
          Sound.play("card");
          if (before === 3) trickCleared = false;     // that closed the trick
        }
        render();
        step();
      }, wait);
    }

    // the computer names the suit it holds most of, seeing only its three cards
    function botTrump(seat){
      const count = [0, 0, 0, 0];
      g.hands[seat].forEach((c) => { if (!Joker.isJoker(c)) count[Joker.suitOf(c)]++; });
      let best = 0;
      count.forEach((n, i) => { if (n > count[best]) best = i; });
      return count[best] ? best : Joker.NOTRUMP;
    }

    /* ---------------- the end of a hand ---------------- */
    function showHand(){
      const h = g.history[g.history.length - 1];
      const box = document.getElementById("handBody");
      box.innerHTML = "";
      const t = document.createElement("table");
      t.className = "jkTable";
      const head = document.createElement("tr");
      ["", "ბიდი", "აიღო", "ქულა"].forEach((s) => {
        const th = document.createElement("th"); th.textContent = s; head.appendChild(th);
      });
      t.appendChild(head);
      NAMES.forEach((n, p) => {
        const tr = document.createElement("tr");
        if (p === ME) tr.className = "me";
        const name = document.createElement("td"); name.textContent = n;
        const bid = document.createElement("td"); bid.textContent = h.bids[p];
        const took = document.createElement("td"); took.textContent = h.took[p];
        const pts = document.createElement("td");
        pts.className = "pts " + (h.points[p] < 0 ? "bad" : h.bids[p] === h.took[p] ? "good" : "");
        pts.textContent = (h.points[p] > 0 ? "+" : "") + h.points[p];
        [name, bid, took, pts].forEach((td) => tr.appendChild(td));
        t.appendChild(tr);
      });
      box.appendChild(t);

      if (g.setBonus) {
        const line = document.createElement("p");
        line.className = "jkBonus";
        const won = g.setBonus.map((n, p) => n > 0 ? NAMES[p] + " +" + n : null).filter(Boolean);
        line.textContent = "სეტის ბონუსი: " + won.join(" · ");
        box.appendChild(line);
      }

      const mine = h.points[ME];
      document.getElementById("handTitle").textContent =
        h.bids[ME] === h.took[ME] ? "ზუსტად! 🎯"
        : mine < 0 ? "ხიშტი 💥" : "ხელი დასრულდა";
      if (h.bids[ME] === h.took[ME]) { Sound.play("handWin"); Fx.cheer(); }
      else Sound.play("handLose");

      const btn = document.getElementById("handBtn");
      btn.textContent = g.hand + 1 >= Joker.HANDS ? "შედეგი" : "შემდეგი ხელი ▶";
      btn.onclick = () => {
        document.getElementById("handOverlay").classList.remove("show");
        Joker.nextHand(g);
        trickCleared = true;
        render();
        setTimeout(step, PACE.betweenHands);
      };
      document.getElementById("handOverlay").classList.add("show");
    }

    function showResult(){
      const box = document.getElementById("resultBody");
      box.innerHTML = "";
      const order = [0, 1, 2, 3].sort((a, b) => g.scores[b] - g.scores[a]);
      const t = document.createElement("table");
      t.className = "jkTable";
      order.forEach((p, i) => {
        const tr = document.createElement("tr");
        if (p === ME) tr.className = "me";
        const pos = document.createElement("td"); pos.textContent = (i + 1) + ".";
        const name = document.createElement("td"); name.textContent = NAMES[p];
        const pts = document.createElement("td");
        pts.className = "pts " + (g.scores[p] < 0 ? "bad" : "");
        pts.textContent = g.scores[p];
        [pos, name, pts].forEach((td) => tr.appendChild(td));
        t.appendChild(tr);
      });
      box.appendChild(t);
      const won = g.winner === ME;
      document.getElementById("resultTitle").textContent = won ? "🏆 შენ მოიგე!" : "თამაში დასრულდა";
      if (won) { Sound.play("win"); Fx.confetti(80, { spread: 0.8 }); } else Sound.play("lose");
      document.getElementById("resultBtn").onclick = () => {
        document.getElementById("resultOverlay").classList.remove("show");
        startMatch();
      };
      document.getElementById("resultOverlay").classList.add("show");
    }

    /* ---------------- a new match ---------------- */
    function startMatch(){
      document.getElementById("handOverlay").classList.remove("show");
      document.getElementById("resultOverlay").classList.remove("show");
      busy = false; pending = null; trickCleared = true;
      clearTimeout(trickTimer);
      g = Joker.newGame({ dealer: 3 });      // so you are the first to bid
      Joker.deal(g);
      render();
      step();
    }

    startMatch();
  </script>
</body>
</html>
